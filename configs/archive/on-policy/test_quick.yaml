# Quick test config - runs in ~2 minutes
algo: PPOLag
env_id: CityLearnSafety-SoC-v0

train_cfgs:
  total_steps: 10000      # Very short (normally ~5M)
  vector_env_nums: 1
  parallel: 1

algo_cfgs:
  steps_per_epoch: 2000   # Short epochs
  update_iters: 10

lagrange_cfgs:
  cost_limit: 100.0       # Your target from baseline analysis
  lagrangian_multiplier_init: 0.001
  lambda_lr: 0.035
  lambda_optimizer: Adam

logger_cfgs:
  log_dir: ./runs/test_quick
  save_model_freq: 2      # Save every 2 epochs
  use_wandb: false

model_cfgs:
  actor:
    hidden_sizes: [256, 256]
    activation: tanh
  critic:
    hidden_sizes: [256, 256]
    activation: tanh
