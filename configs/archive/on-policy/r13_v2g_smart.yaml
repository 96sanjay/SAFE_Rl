# R13: Sauté MDP + V2G-aware reward (smart policy)
# Base: R12a (Sauté C1) + 4 reward fixes for intelligent V2G
# Changes from R12a:
#   - Fix 1: r_sb asymmetric (no export penalty)
#   - Fix 2: Rebalanced weights (mu=1.5, alpha_grid=2.0, alpha_build=1.0)
#   - Fix 3: EV shaping reward enabled (lambda_ev=2.0)
#   - Fix 4: r_sg export credit (0.5)
algo: PPOLagMulti
env_id: CityLearnSafety-V2G-v2
seed: 42

train_cfgs:
  total_steps: 437950          # 50 epochs × 8759 steps/epoch
  vector_env_nums: 1
  parallel: 1

algo_cfgs:
  steps_per_epoch: 8759
  update_iters: 30
  target_kl: 0.12
  kl_early_stop: true
  batch_size: 128
  obs_normalize: true
  reward_normalize: true
  cost_normalize: false
  standardized_cost_adv: true
  entropy_coef: 0.005
  max_grad_norm: 40.0

lagrange_cfgs:
  cost_limit: 21800
  lagrangian_multiplier_init: 0.1
  lambda_lr: 0.035
  lambda_optimizer: Adam
  lagrangian_upper_bound: 3.0

multi_cfgs:
  tau: 1.0
  cost_limit_0: 1800           # C0: EV departure (Lagrangian)
  cost_limit_1: 1500           # C1: EV dense (Sauté — cost always 0)
  cost_limit_2: 4000           # C2: Battery SoC (inactive, weight=0)
  cost_limit_3: 12000          # C3: Building power
  cost_limit_4: 2500           # C4: Grid power

model_cfgs:
  actor:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.0003
  critic:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.001
  linear_lr_decay: false

logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  save_model_freq: 5
  log_dir: ./runs/r13_v2g_smart/5bld
  window_lens: 1
