# R27f: Moderate dual — r_ev + r_ev_smart
# =========================================================
# Key changes from R27a:
#   1. r_ev=2.0 (moderate charging incentive)
#   2. r_ev_smart=1.0 (headroom-gated price signal)
#   3. r_ev_guard=0.5 (light anti-discharge guard)
#   4. r_sg=1.0, r_sb=1.0 (REDUCED from 1.5 to make room for EV)
#   5. Test: does dual r_ev + r_ev_smart give best of both?
# =========================================================
algo: PPOLagMulti
env_id: CityLearnSafety-V2G-v2
seed: 42

train_cfgs:
  device: cuda:0
  total_steps: 350360        # 40 epochs * 8759 steps
  vector_env_nums: 1
  parallel: 1

algo_cfgs:
  steps_per_epoch: 8759
  update_iters: 10
  target_kl: 0.08
  kl_early_stop: true
  batch_size: 512
  obs_normalize: true
  reward_normalize: true
  cost_normalize: false
  standardized_cost_adv: true
  entropy_coef: 0.005
  max_grad_norm: 0.5

lagrange_cfgs:
  cost_limit: 21800
  lagrangian_multiplier_init: 0.001
  lambda_lr: 0.02
  lambda_optimizer: Adam
  lagrangian_upper_bound: 35.0

multi_cfgs:
  tau: 1.0

  # C0: EV departure
  cost_limit_0: 200
  # C1: unused
  cost_limit_1: 999999
  # C2: Battery SoC band
  cost_limit_2: 1500
  # C3: Building power
  cost_limit_3: 5000
  # C4: Grid power
  cost_limit_4: 8000

  # Default PID gains
  pid_kp: 0.1
  pid_ki: 0.01
  pid_kd: 0.01
  pid_d_delay: 10
  pid_delta_p_ema_alpha: 0.95
  pid_delta_d_ema_alpha: 0.95

  # C0: EV departure PID (same as R27a)
  pid_kp_0: 0.5
  pid_ki_0: 0.01
  pid_kd_0: 0.0
  pid_ema_p_0: 0.0

  # C3: Building power PID
  pid_kp_3: 0.5
  pid_ki_3: 0.05

  # C4: Grid power PID
  pid_kp_4: 0.3
  pid_ki_4: 0.03

model_cfgs:
  actor_type: gaussian_learning
  actor:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.0002
  critic:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.001
  linear_lr_decay: false

logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  save_model_freq: 5
  log_dir: ./runs/headroom_moderate/5bld
  window_lens: 1
