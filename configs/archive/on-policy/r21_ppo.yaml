# R21: PPOLagMulti — Targeted fixes on top of R19
#
# R19 diagnosis:
#   - StopIter=1 in 52/80 epochs (65%): policy LR too high → KL blowups
#   - Lambda_2 grew 0.073→2.153 (72% of λ cap): C2 Lagrangian wasting gradient budget
#     on analytically-solvable battery SoC constraint (COST_W_C2=0 doesn't help —
#     per-constraint C2 cost still feeds PPOLagMulti via cost_stems_battery key)
#   - Lambda_3/4 saturated at 3.0 from ep 1-3: no increasing pressure in Phase 3
#   - C3/C4 reversed after ep 64: reward won over saturated lambdas
#
# R21 Fixes:
#   1. actor_lr 0.0003 → 0.0001   — stop KL blowups → 65% wasted epochs → usable
#   2. target_kl 0.12 → 0.08      — tighter trust region (paired with smaller LR)
#   3. batch_size 128 → 256        — stable gradient estimates, less KL per pass
#   4. lambda_upper_bound 3.0→5.0  — 67% more pressure; critical for Phase 3 reversal
#   5. BATT_CLAMP=1 (run script)   — eliminate Lambda_2 bloat; redirect to C3/C4
#
# Not changed from R19:
#   - No STEMS (MLP beats STEMS on C4: 275/ep vs 156/ep decline rate)
#   - Same curriculum schedule (Phase 2 ep 20-40 — worked well for C0)
#   - Same PID gains, same cost limits
#   - Same reward config (zeroed r_load_shift, r_sg, reduced r_ev_guard)

algo: PPOLagMulti
env_id: CityLearnSafety-V2G-v2
seed: 42

train_cfgs:
  total_steps: 787110          # 90 epochs × 8759 steps (10 more than R19 for lower LR)
  vector_env_nums: 1
  parallel: 1

algo_cfgs:
  steps_per_epoch: 8759
  update_iters: 30
  target_kl: 0.08              # R21: 0.12→0.08 (paired with lower LR; 0.06 too tight)
  kl_early_stop: true
  batch_size: 256              # R21: 128→256 (stable gradients, lower per-pass KL)
  obs_normalize: true
  reward_normalize: true
  cost_normalize: false
  standardized_cost_adv: true
  entropy_coef: 0.005
  max_grad_norm: 40.0

lagrange_cfgs:
  cost_limit: 21800
  lagrangian_multiplier_init: 0.001
  lambda_lr: 0.035
  lambda_optimizer: Adam
  lagrangian_upper_bound: 5.0  # R21: 3.0→5.0 (prevents Phase 3 reversal seen in R19)

multi_cfgs:
  tau: 1.0
  cost_limit_0: 999999
  cost_limit_1: 1500
  cost_limit_2: 4000
  cost_limit_3: 3000
  cost_limit_4: 1500

  # Same curriculum as R19
  anneal_cost_limit_0: [999999, 1800, 20, 40]

  # PID gains (unchanged from R19)
  pid_kp: 0.1
  pid_ki: 0.01
  pid_kd: 0.01
  pid_d_delay: 10
  pid_delta_p_ema_alpha: 0.95
  pid_delta_d_ema_alpha: 0.95

  pid_kp_0: 5.0
  pid_ki_0: 0.0
  pid_kd_0: 0.0
  pid_ema_p_0: 0.0
  pid_kp_3: 0.5
  pid_ki_3: 0.05
  pid_kp_4: 0.3
  pid_ki_4: 0.03

model_cfgs:
  actor:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.0001              # R21: 0.0003→0.0001 (main fix for StopIter=1 in 65% of R19 epochs)
  critic:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.001
  linear_lr_decay: false

logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  save_model_freq: 5
  log_dir: ./runs/r21_ppo/5bld
  window_lens: 1
