# PPOLag V2: Deep architecture for 153-dim observation space
# Key improvements:
#   - 3-layer deep network [512, 512, 256]
#   - Larger batch size (512) for stable gradients
#   - Higher entropy (0.01) for exploration
#   - Fixed EV dense cost (1.0 instead of 5.0)
#   - Aggressive cost limit (45k)

algo: PPOLag
env_id: CityLearnSafety-SoC-v0
seed: 42

train_cfgs:
  total_steps: 875900          # 100 epochs × 8759 steps/epoch
  vector_env_nums: 1
  parallel: 1

algo_cfgs:
  steps_per_epoch: 8759
  target_kl: 0.10             # Allow policy updates
  kl_early_stop: true
  batch_size: 512             # ← OPTION C: Larger batches
  update_iters: 40            # ← OPTION C: Fewer iters (same total)
  obs_normalize: true
  reward_normalize: true
  cost_normalize: false
  entropy_coef: 0.01          # ← INCREASED: More exploration

lagrange_cfgs:
  cost_limit: 45000            # ← Aggressive but feasible
  lagrangian_multiplier_init: 10.0
  lambda_lr: 0.05             
  lambda_optimizer: SGD

model_cfgs:
  actor:
    hidden_sizes: [512, 512, 256]  # ← DEEP: Hierarchical features
    activation: relu                # ← CHANGED: Better gradients
    lr: 0.0002                      # ← LOWER: Conservative for deep net
  critic:
    hidden_sizes: [512, 512, 256]  # ← DEEP: Match actor
    activation: relu                # ← CHANGED: Better gradients  
    lr: 0.001                       # Standard critic LR

logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  save_model_freq: 5          
  log_dir: ./runs/ppolag_P95_V2
  window_lens: 1
