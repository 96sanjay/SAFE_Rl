# R28 Optuna Best: best trial from r28_sweep (63 complete, 158 pruned)
# Best score: 343.31, best params applied directly.
# =========================================================
algo: PPOLagMulti
env_id: CityLearnSafety-V2G-v2
seed: 42

train_cfgs:
  device: cpu
  total_steps: 875900                     # 100 epochs
  vector_env_nums: 1
  parallel: 1

algo_cfgs:
  steps_per_epoch: 8759
  update_iters: 10
  target_kl: 0.06
  kl_early_stop: true
  batch_size: 256
  obs_normalize: true
  reward_normalize: true
  cost_normalize: false
  standardized_cost_adv: true
  entropy_coef: 0.005
  max_grad_norm: 0.5

lagrange_cfgs:
  cost_limit: 21800
  lagrangian_multiplier_init: 0.001
  lambda_lr: 0.02
  lambda_optimizer: Adam
  lagrangian_upper_bound: 25.832

multi_cfgs:
  tau: 1.0

  # Per-constraint cost limits (Optuna best)
  cost_limit_0: 105.616
  cost_limit_1: 999999
  cost_limit_2: 3313.09
  cost_limit_3: 19065.59
  cost_limit_4: 11054.52

  # PID defaults
  pid_kp: 0.1
  pid_ki: 0.01
  pid_kd: 0.01
  pid_d_delay: 10
  pid_delta_p_ema_alpha: 0.95
  pid_delta_d_ema_alpha: 0.95

  # C0: fixed (working)
  pid_kp_0: 2.0
  pid_ki_0: 0.05
  pid_kd_0: 0.0
  pid_ema_p_0: 0.0

  # C2: fixed (working)
  pid_kp_2: 0.1
  pid_ki_2: 0.01

  # C3: Optuna best
  pid_kp_3: 0.5027
  pid_ki_3: 0.00795
  pid_kd_3: 0.0

  # C4: Optuna best
  pid_kp_4: 0.10514
  pid_ki_4: 0.00679

model_cfgs:
  actor_type: gaussian_learning
  actor:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.0003
  critic:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.001
  linear_lr_decay: false

logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  save_model_freq: 40
  log_dir: ./runs/r28_optuna_best
  window_lens: 1
