algo: PPOLag
env_id: CityLearnSafety-SoC-v0
seed: 42
train_cfgs:
  total_steps: 876000        # 100 epochs × 8760 steps
  vector_env_nums: 1
algo_cfgs:
  steps_per_epoch: 8760
  target_kl: 0.02
  batch_size: 256
  update_iters: 10
  obs_normalize: true
  reward_normalize: false
  cost_normalize: false
  entropy_coef: 0.01
lagrange_cfgs:
  cost_limit: 400.0
  lagrangian_multiplier_init: 0.0
  lambda_lr: 0.035
  lambda_optimizer: Adam
model_cfgs:
  actor:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.0003
  critic:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.001
logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  save_model_freq: 10
  log_dir: ./runs/ppo_lag_100ep_balanced
  window_lens: 1
