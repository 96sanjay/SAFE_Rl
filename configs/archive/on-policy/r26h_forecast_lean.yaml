# R26h: Forecast-Aware Arbitrage — LEAN (5 reward terms)
# =====================================================
# Minimal reward suite to maximize temporal transformer signal:
#   r_sg (grid stability), r_sb (building limits), r_ren (solar),
#   r_barrier (SoC safety), r_trajectory (forecast arbitrage)
#
# ALL myopic price signals disabled (r_eco, r_load_shift, r_price_arb)
# ALL flat EV signals disabled (r_ev, r_ev_guard) — C0 PID handles departure
# C2 range: 0.0–0.95 (not 0.05–0.95)
# =====================================================
algo: PPOLagMulti
env_id: CityLearnSafety-V2G-v2
seed: 42

train_cfgs:
  device: cuda:0
  total_steps: 1051080       # 120 epochs * 8759 steps
  vector_env_nums: 1
  parallel: 1

algo_cfgs:
  steps_per_epoch: 8759
  update_iters: 10
  target_kl: 0.08
  kl_early_stop: true
  batch_size: 512
  obs_normalize: true
  reward_normalize: true
  cost_normalize: false
  standardized_cost_adv: true
  entropy_coef: 0.005
  max_grad_norm: 0.5

lagrange_cfgs:
  cost_limit: 21800
  lagrangian_multiplier_init: 0.001
  lambda_lr: 0.02
  lambda_optimizer: Adam
  lagrangian_upper_bound: 10.0

multi_cfgs:
  tau: 1.0
  cost_limit_0: 999999
  cost_limit_1: 999999
  cost_limit_2: 1500
  cost_limit_3: 15000
  cost_limit_4: 10000

  anneal_cost_limit_0: [999999, 50, 20, 40]

  pid_kp: 0.1
  pid_ki: 0.01
  pid_kd: 0.01
  pid_d_delay: 10
  pid_delta_p_ema_alpha: 0.95
  pid_delta_d_ema_alpha: 0.95

  pid_kp_0: 5.0
  pid_ki_0: 0.0
  pid_kd_0: 0.0
  pid_ema_p_0: 0.0
  pid_kp_3: 0.3
  pid_ki_3: 0.03
  pid_kp_4: 0.2
  pid_ki_4: 0.02

model_cfgs:
  actor_type: gaussian_learning
  actor:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.0002
  critic:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.001
  linear_lr_decay: false

logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  save_model_freq: 5
  log_dir: ./runs/r26h_forecast_lean/5bld
  window_lens: 1
