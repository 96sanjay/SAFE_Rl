algo: FOCOPS
env_id: CityLearnSafety-SoC-v0
seed: 42
train_cfgs:
  total_steps: 262770
  vector_env_nums: 1
  parallel: 1
algo_cfgs:
  steps_per_epoch: 8759
  target_kl: 0.01             # MUCH TIGHTER - was 0.05
  kl_early_stop: true
  batch_size: 256
  update_iters: 40
  obs_normalize: true
  reward_normalize: true
  cost_normalize: false
  entropy_coef: 0.005
  focops_eta: 0.001           # MUCH SMALLER - was 0.02
lagrange_cfgs:
  cost_limit: 50000
  lagrangian_multiplier_init: 10.0   # Higher start
  lambda_lr: 0.05
  lambda_optimizer: Adam
model_cfgs:
  actor:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.0001                # SMALLER - was 0.0003
  critic:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.001
  linear_lr_decay: false
logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  save_model_freq: 5
  log_dir: ./runs/focops_FIXED
  window_lens: 1
