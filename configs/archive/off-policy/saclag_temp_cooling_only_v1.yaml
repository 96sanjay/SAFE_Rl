# SAC-Lag + PID Lagrangian + Action Masking + BC warm-start
# Temperature cooling-only case study (3D action space)
# Key advantage over PPO-Lag: Q(s,a) critic can predict future violations

algo: SACLagTempCoolingOnly
env_id: CityLearnTemp-CoolingOnly-Masked-Reward-v0
seed: 42

train_cfgs:
  device: cpu
  vector_env_nums: 1
  parallel: 1
  total_steps: 132420        # 60 epochs * 2207 steps
  eval_episodes: 0           # We eval separately with evaluate_ppo_temp_case_study.py

algo_cfgs:
  steps_per_epoch: 2207
  update_cycle: 1
  update_iters: 1
  size: 200000               # ~90 episodes replay buffer
  batch_size: 256
  reward_normalize: false
  cost_normalize: false
  obs_normalize: false
  max_grad_norm: 40.0
  use_critic_norm: false
  polyak: 0.005
  gamma: 0.99
  start_learning_steps: 2207 # 1 full episode random exploration
  policy_delay: 2
  alpha: 0.2
  auto_alpha: true
  use_cost: true
  warmup_epochs: 0
  use_exploration_noise: false

lagrange_cfgs:
  cost_limit: 40.0
  lagrangian_multiplier_init: 0.001
  lambda_lr: 0.035
  lambda_optimizer: Adam

pid_lagrange_cfgs:
  cost_limit: 40.0
  pid_kp: 1.0
  pid_ki: 0.1
  pid_kd: 0.01
  pid_d_delay: 10
  pid_delta_p_ema_alpha: 0.95
  pid_delta_d_ema_alpha: 0.95
  penalty_max: 100.0          # Higher than PPO — SAC Q-critic needs more room
  lagrangian_multiplier_init: 0.001
  normalize_by_limit: true

bc_cfgs:
  epochs: 10
  rollout_steps: 2207
  batch_size: 512
  seed: 42

model_cfgs:
  weight_initialization_mode: kaiming_uniform
  actor_type: gaussian_sac
  linear_lr_decay: false
  actor:
    hidden_sizes: [256, 256]
    activation: relu
    lr: 0.0003
  critic:
    num_critics: 2
    hidden_sizes: [256, 256]
    activation: relu
    lr: 0.0003

# Never-block mask: always allow cooling, force minimum when hot
env_cfgs:
  policy_mask_cooling_force_trigger: 25.0
  policy_mask_cooling_force_range: 2.0
  policy_mask_cooling_min_cap: 0.8
  policy_mask_cooling_full_range: 4.0
  policy_mask_cooling_setpoint_deadband: 0.3

logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  save_model_freq: 1
  log_dir: ./runs/saclag_temp_cooling_only_v1
  window_lens: 1
