# R10b: STEMS v3b — Fixed temporal bypass + stable Lagrangian
# Changes from R10:
#   - Encoder: concat+proj replaces residual addition (forces temporal usage)
#   - cost_limit: 300K → 600K (matches actual epoch-0 cost magnitude)
#   - lambda_lr: 0.001 → 0.0005 (slower lambda growth prevents StopIter collapse)
#   - update_iters: 60 → 30 (faster epochs, StopIter was 47 in R10 epoch 0)
algo: PPOLag
env_id: CityLearnSafety-V2G-v2
seed: 42

train_cfgs:
  total_steps: 437950          # 50 epochs × 8759 steps/epoch
  vector_env_nums: 1
  parallel: 1

algo_cfgs:
  steps_per_epoch: 8759
  update_iters: 30             # CHANGED: 60→30 (halves update time, R10 only used 47 anyway)
  target_kl: 0.12              # CHANGED: 0.10→0.12 (slightly more room per step)
  kl_early_stop: true
  batch_size: 128              # Reduced from 256 to lower peak memory (14GB RAM, no swap)
  obs_normalize: true
  reward_normalize: true
  cost_normalize: true
  entropy_coef: 0.005

lagrange_cfgs:
  cost_limit: 400000           # Between initial (~590K) and target — lambda grows slowly
  lagrangian_multiplier_init: 0.1  # Start very low, let it grow naturally
  lambda_lr: 0.0005            # Slow lambda growth prevents StopIter collapse
  lambda_optimizer: SGD

model_cfgs:
  actor:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.0003
  critic:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.001
  linear_lr_decay: false

logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  save_model_freq: 5
  log_dir: ./runs/r10b_stems_v3/r10b_5bld
  window_lens: 1
