# FOCOPS V2: Fixed for conservative constraint handling
algo: FOCOPS
env_id: CityLearnSafety-SoC-v0
seed: 42

train_cfgs:
  total_steps: 875900
  vector_env_nums: 1

algo_cfgs:
  steps_per_epoch: 8759
  target_kl: 0.15              # ← HIGHER: Allow bigger updates
  kl_early_stop: true
  batch_size: 256              # ← SMALLER: More frequent updates
  update_iters: 60
  obs_normalize: true
  reward_normalize: true
  cost_normalize: false
  entropy_coef: 0.02           # ← HIGHER: More exploration

lagrange_cfgs:
  cost_limit: 45000
  lagrangian_multiplier_init: 5.0   # ← LOWER: Less aggressive initially
  lambda_lr: 0.03                    # ← LOWER: Gentler λ updates
  lambda_optimizer: Adam             # ← CHANGED: Adam for smoother updates

model_cfgs:
  actor:
    hidden_sizes: [512, 512, 256]
    activation: relu
    lr: 0.0001                  # ← LOWER: Conservative updates
  critic:
    hidden_sizes: [512, 512, 256]
    activation: relu
    lr: 0.0005                  # ← LOWER: Match actor

logger_cfgs:
  use_tensorboard: true
  save_model_freq: 5
  log_dir: ./runs/focops_P95_V2
