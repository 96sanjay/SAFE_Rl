# TD3 SP-RL: 5-building, 100 epochs, same reward as R21
# Differentiable projection (C2/C3/C4 hard) + Lagrangian (C0/C1)
# PenC penalty critic (Markgraf et al. 2025)

algo: TD3LagMulti
env_id: CityLearnSafety-V2G-v2
seed: 42

train_cfgs:
  total_steps: 875900           # 100 epochs × 8759
  vector_env_nums: 1
  parallel: 1

algo_cfgs:
  steps_per_epoch: 8759
  update_cycle: 8
  update_iters: 1
  size: 500000
  batch_size: 256
  reward_normalize: false
  cost_normalize: false
  obs_normalize: false
  max_grad_norm: 40.0
  polyak: 0.005
  gamma: 0.99
  start_learning_steps: 8759
  policy_delay: 2
  exploration_noise: 0.1
  noise_clip: 0.5
  use_cost: true
  warmup_epochs: 5

model_cfgs:
  weight_initialization_mode: kaiming_uniform
  actor_type: mlp
  linear_lr_decay: false
  actor:
    hidden_sizes: [256, 256]
    activation: relu
    lr: 0.0003
  critic:
    num_critics: 2
    hidden_sizes: [256, 256]
    activation: relu
    lr: 0.0003

lagrange_cfgs:
  cost_limit: 21800
  lagrangian_multiplier_init: 0.001
  lambda_lr: 0.035
  lambda_optimizer: Adam
  lagrangian_upper_bound: 5.0

multi_cfgs:
  tau: 1.0
  cost_limit_0: 999999
  cost_limit_1: 1500
  anneal_cost_limit_0: [999999, 1800, 20, 40]
  pid_kp: 0.1
  pid_ki: 0.01
  pid_kd: 0.01
  pid_d_delay: 10
  pid_delta_p_ema_alpha: 0.95
  pid_delta_d_ema_alpha: 0.95
  pid_kp_0: 5.0
  pid_ki_0: 0.0
  pid_kd_0: 0.0
  pid_ema_p_0: 0.0
  pid_kp_3: 0.5
  pid_ki_3: 0.05
  pid_kp_4: 0.3
  pid_ki_4: 0.03

projector_cfgs:
  penalty_w: 1.0
  solver_eps: 0.0001
  solver_max_iters: 5000
  penalty_critic_lr: 0.0003

logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  save_model_freq: 5
  log_dir: ./runs/td3_sp_rl_5bld_100ep
  window_lens: 1
