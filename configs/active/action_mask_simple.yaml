# R29: Action Mask + Simplified 4-Term Reward
#
# Key changes from R28:
#   1. Action mask (safety layer) for C3/C2 → lambdas stay low
#   2. Simplified reward: 4 terms, 0 conflicts (was 6 terms, 3 conflicts)
#   3. R_batt = -action × price (AL-SAC style, replaces complex r_load_shift)
#   4. All conflicting terms disabled (r_ramp, r_ev_guard, r_barrier)
#   5. Saute shaped_alpha reduced 10→2 (was drowning reward)
#   6. No curriculum (mask keeps lambdas low from epoch 0)
algo: PPOLagMulti
env_id: CityLearnSafety-V2G-v2
seed: 42

train_cfgs:
  total_steps: 875900          # 100 epochs × 8759 steps/epoch
  vector_env_nums: 1
  parallel: 1

algo_cfgs:
  steps_per_epoch: 8759
  update_iters: 30
  target_kl: 0.08
  kl_early_stop: true
  batch_size: 256
  obs_normalize: true
  reward_normalize: true
  cost_normalize: false
  standardized_cost_adv: true
  entropy_coef: 0.005
  max_grad_norm: 40.0

lagrange_cfgs:
  cost_limit: 21800
  lagrangian_multiplier_init: 0.001
  lambda_lr: 0.035
  lambda_optimizer: Adam
  lagrangian_upper_bound: 3.0

multi_cfgs:
  tau: 1.0
  # All constraints active from epoch 0 (no curriculum needed)
  cost_limit_0: 1800           # C0: EV departure (Saute handles, but Lagrangian backs up)
  cost_limit_1: 1500           # C1: EV dense
  cost_limit_2: 4000           # C2: Battery SoC (mask handles, Lagrangian backs up)
  cost_limit_3: 20000          # C3: Building power (mask handles, Lagrangian backs up)
  cost_limit_4: 15000          # C4: Grid power (Lagrangian primary handler)

  pid_kp: 0.1
  pid_ki: 0.01
  pid_kd: 0.01
  pid_d_delay: 10
  pid_delta_p_ema_alpha: 0.95
  pid_delta_d_ema_alpha: 0.95
  pid_kp_0: 5.0
  pid_ki_0: 0.0
  pid_kd_0: 0.0
  pid_ema_p_0: 0.0
  pid_kp_3: 0.5
  pid_ki_3: 0.05
  pid_kp_4: 0.3
  pid_ki_4: 0.03

model_cfgs:
  actor:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.0003
  critic:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.001
  linear_lr_decay: false

logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  save_model_freq: 5
  log_dir: ./runs/action_mask_simple/5bld
  window_lens: 1
