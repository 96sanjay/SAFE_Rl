# R9: STEMS GCN-Transformer with aggressive C3 focus
# Changes from R8:
#   - cost_limit: 24400 → 75000 (achievable target)
#   - lambda_lr: 0.05 → 0.01 (slower, more stable)
#   - lambda_init: 10.0 → 1.0 (reasonable starting point)
#   - W_COST_SOC: 10.0 → 5.0 (halved, reduces "always discharge" incentive)
#   - W_COST_BUILDING: 0.5 → 5.0 (10x increase, forces per-building coordination)
algo: PPOLag
env_id: CityLearnSafety-V2G-v2
seed: 42

train_cfgs:
  total_steps: 437950          # 50 epochs × 8759 steps/epoch
  vector_env_nums: 1
  parallel: 1

algo_cfgs:
  steps_per_epoch: 8759
  update_iters: 60
  target_kl: 0.10
  kl_early_stop: true
  batch_size: 256
  obs_normalize: true
  reward_normalize: true
  cost_normalize: false
  entropy_coef: 0.005

lagrange_cfgs:
  cost_limit: 300000           # CHANGED: was 24400; scaled for COST_W_C3=5.0 (epoch0 ~554K)
  lagrangian_multiplier_init: 1.0   # CHANGED: was 10.0
  lambda_lr: 0.001             # CHANGED: was 0.05; slow growth keeps reward visible
  lambda_optimizer: SGD

model_cfgs:
  actor:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.0005
  critic:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.001
  linear_lr_decay: false

logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  save_model_freq: 5
  log_dir: ./runs/r9_c3focus/r9_5bld
  window_lens: 1
