algo: TD3          # ← change per file: TRPOLag, CPO, RCPO, SACLag, TD3Lag, PCPO, CPPOPid
env_id: CityLearnSafety-SoC-v0

train_cfgs:
  total_steps: 87590      # 10 × 8759 (your measured horizon)
  vector_env_nums: 1      # keep single env for clean epochs

algo_cfgs:
  steps_per_epoch: 8759   # 1 episode per epoch (works for on- and off-policy)
  obs_normalize: true
  reward_normalize: true
  cost_normalize: true    # your build supports it; helps the cost critic

logger_cfgs:
  use_tensorboard: true
  use_wandb: false
