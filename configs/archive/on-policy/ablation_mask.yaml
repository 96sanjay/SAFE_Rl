# Ablation Study: Action Mask (C2+C3+C4)
# Exact copy of R21 config — only log_dir differs.
# Paired with run_ablation_mask.sh which sets ACTION_MASK=0 (baseline) or 1 (treatment).

algo: PPOLagMulti
env_id: CityLearnSafety-V2G-v2
seed: 42

train_cfgs:
  total_steps: 787110          # 90 epochs × 8759 steps (10 more than R19 for lower LR)
  vector_env_nums: 1
  parallel: 1

algo_cfgs:
  steps_per_epoch: 8759
  update_iters: 30
  target_kl: 0.08              # R21: 0.12→0.08 (paired with lower LR; 0.06 too tight)
  kl_early_stop: true
  batch_size: 256              # R21: 128→256 (stable gradients, lower per-pass KL)
  obs_normalize: true
  reward_normalize: true
  cost_normalize: false
  standardized_cost_adv: true
  entropy_coef: 0.005
  max_grad_norm: 40.0

lagrange_cfgs:
  cost_limit: 21800
  lagrangian_multiplier_init: 0.001
  lambda_lr: 0.035
  lambda_optimizer: Adam
  lagrangian_upper_bound: 5.0  # R21: 3.0→5.0 (prevents Phase 3 reversal seen in R19)

multi_cfgs:
  tau: 1.0
  cost_limit_0: 999999
  cost_limit_1: 1500
  cost_limit_2: 4000
  cost_limit_3: 3000
  cost_limit_4: 1500

  # Same curriculum as R19
  anneal_cost_limit_0: [999999, 1800, 20, 40]

  # PID gains (unchanged from R19)
  pid_kp: 0.1
  pid_ki: 0.01
  pid_kd: 0.01
  pid_d_delay: 10
  pid_delta_p_ema_alpha: 0.95
  pid_delta_d_ema_alpha: 0.95

  pid_kp_0: 5.0
  pid_ki_0: 0.0
  pid_kd_0: 0.0
  pid_ema_p_0: 0.0
  pid_kp_3: 0.5
  pid_ki_3: 0.05
  pid_kp_4: 0.3
  pid_ki_4: 0.03

model_cfgs:
  actor:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.0001              # R21: 0.0003→0.0001 (main fix for StopIter=1 in 65% of R19 epochs)
  critic:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.001
  linear_lr_decay: false

logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  save_model_freq: 5
  log_dir: ./runs/ablation_mask/5bld
  window_lens: 1
