# R10: STEMS v3 — Per-Node Temporal Transformer + GCN + Gated Fusion
# Changes from R9:
#   - STEMS_ENCODER_VERSION=v3 (adds per-building temporal Transformer)
#   - CITYLEARN_TEMPORAL_WINDOW=12 (12 hours of history in observation)
#   - obs_dim increases from 198 to 330 (132 extra history dims)
#   - Same Lagrangian tuning and cost weights as R9
algo: PPOLag
env_id: CityLearnSafety-V2G-v2
seed: 42

train_cfgs:
  total_steps: 437950          # 50 epochs × 8759 steps/epoch
  vector_env_nums: 1
  parallel: 1

algo_cfgs:
  steps_per_epoch: 8759
  update_iters: 60
  target_kl: 0.10
  kl_early_stop: true
  batch_size: 256
  obs_normalize: true
  reward_normalize: true
  cost_normalize: true         # CHANGED: normalize cost advantages for stable StopIter
  entropy_coef: 0.005

lagrange_cfgs:
  cost_limit: 300000
  lagrangian_multiplier_init: 1.0
  lambda_lr: 0.001
  lambda_optimizer: SGD

model_cfgs:
  actor:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.0003                 # Slightly lower LR for larger encoder
  critic:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.001
  linear_lr_decay: false

logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  save_model_freq: 5
  log_dir: ./runs/r10_stems_v3/r10_5bld
  window_lens: 1
