# R6 Smart C3: PPOLag config combining R5-A (StopIter fix) + R5-B (sparse Saute)
#
# R5-A fix: update_iters: 60 (was 1 in R4/R5-B, broke value function)
# R5-B fix: Sparse Saute already in safety_env_v3.py V3 cost (only triggers on EV departures)
# P0: Spatial obs (+N*4 dims) — set CITYLEARN_SPATIAL_OBS=1
# P1: Controllable C3 — set CITYLEARN_C3_CONTROLLABLE=1
#
# Usage: source train_r6_smart_c3.sh && python scripts/train_omnisafe.py --cfg configs/on-policy/ppolag_r6_smart_c3.yaml

algo: PPOLag
env_id: CityLearnSafety-V2G-v2
seed: 42

train_cfgs:
  total_steps: 875900          # 100 epochs × 8759 steps/epoch
  vector_env_nums: 1
  parallel: 1

algo_cfgs:
  steps_per_epoch: 8759
  # R5-A fix: 60 update iters (was 1 in R4/R5-B)
  # Allows value function to train properly for temporal credit assignment
  update_iters: 60
  target_kl: 0.10              # larger KL target → fewer early stops
  kl_early_stop: true
  batch_size: 256
  obs_normalize: true
  reward_normalize: true
  cost_normalize: false
  entropy_coef: 0.005

lagrange_cfgs:
  cost_limit: 83000            # ~75% of baseline (from P95_FINAL)
  lagrangian_multiplier_init: 10.0
  lambda_lr: 0.05              # aggressive SGD for lambda convergence
  lambda_optimizer: SGD

model_cfgs:
  actor:
    # Larger network for spatial obs (base + 128 forecast + N*4 spatial)
    hidden_sizes: [512, 512, 256]
    activation: relu
    lr: 0.0003
  critic:
    hidden_sizes: [512, 512, 256]
    activation: relu
    lr: 0.001
  linear_lr_decay: false

logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  save_model_freq: 5           # save every 5 epochs
  log_dir: ./runs/r6_smart_c3
  window_lens: 1
