# R25b: R19 + EV slack-gated arbitrage (STEMS_EV_SLACK_ARB_SCALE=2.0)
# Changes from R18:
#   1. Cost advantage clipping REMOVED (ppo_lag_multi.py)
#   2. 3 reward signals zeroed (run script env vars)
#   3. Cost limits tightened: C3 12000→3000, C4 2500→1500
#   4. Extended to 80 epochs, Phase 2 annealing extended to ep 40
algo: PPOLagMulti
env_id: CityLearnSafety-V2G-v2
seed: 42

train_cfgs:
  total_steps: 700720          # 80 epochs × 8759 steps/epoch
  vector_env_nums: 1
  parallel: 1

algo_cfgs:
  steps_per_epoch: 8759
  update_iters: 30
  target_kl: 0.12
  kl_early_stop: true
  batch_size: 128
  obs_normalize: true
  reward_normalize: true
  cost_normalize: false
  standardized_cost_adv: true
  entropy_coef: 0.005
  max_grad_norm: 40.0

lagrange_cfgs:
  cost_limit: 21800
  lagrangian_multiplier_init: 0.001
  lambda_lr: 0.035
  lambda_optimizer: Adam
  lagrangian_upper_bound: 3.0    # R19: DOWN from 6.0 — compensates for clip removal

multi_cfgs:
  tau: 1.0
  # C0 starts at 999999 (disabled), anneals to 1800
  cost_limit_0: 999999
  cost_limit_1: 1500
  cost_limit_2: 4000
  cost_limit_3: 3000           # R19: DOWN from 12000 (agent-caused only)
  cost_limit_4: 1500           # R19: DOWN from 2500

  # Curriculum schedule: [start_val, end_val, start_epoch, end_epoch]
  anneal_cost_limit_0: [999999, 1800, 20, 40]   # R19: extended to ep 40 (was 35)

  # PID gains (unchanged from R18)
  pid_kp: 0.1
  pid_ki: 0.01
  pid_kd: 0.01
  pid_d_delay: 10
  pid_delta_p_ema_alpha: 0.95
  pid_delta_d_ema_alpha: 0.95

  # Per-constraint PID
  pid_kp_0: 5.0
  pid_ki_0: 0.0
  pid_kd_0: 0.0
  pid_ema_p_0: 0.0
  pid_kp_3: 0.5
  pid_ki_3: 0.05
  pid_kp_4: 0.3
  pid_ki_4: 0.03

model_cfgs:
  actor:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.0003
  critic:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.001
  linear_lr_decay: false

logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  save_model_freq: 5
  log_dir: ./runs/ablation_C_nosaute
  window_lens: 1
