# R10c: STEMS v3 — Lambda capping fix
# Only change from R10b: lagrangian_upper_bound: 1.0
# Everything else identical to isolate the effect of lambda capping
algo: PPOLag
env_id: CityLearnSafety-V2G-v2
seed: 42

train_cfgs:
  total_steps: 437950          # 50 epochs × 8759 steps/epoch
  vector_env_nums: 1
  parallel: 1

algo_cfgs:
  steps_per_epoch: 8759
  update_iters: 30
  target_kl: 0.12
  kl_early_stop: true
  batch_size: 128
  obs_normalize: true
  reward_normalize: true
  cost_normalize: true
  entropy_coef: 0.005

lagrange_cfgs:
  cost_limit: 400000
  lagrangian_multiplier_init: 0.1
  lambda_lr: 0.0005
  lambda_optimizer: SGD
  # lagrangian_upper_bound: 1.0 applied via monkeypatch (OmniSafe YAML validator rejects unknown keys)

model_cfgs:
  actor:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.0003
  critic:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.001
  linear_lr_decay: false

logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  save_model_freq: 5
  log_dir: ./runs/r10c_stems_v3/r10c_5bld
  window_lens: 1
