# R23: PPOLagMulti — Solar-Aligned EV Charging Reward
#
# Based on R21 (best PPO run). Single change:
#   - STEMS_ALPHA_EV_SOLAR=3.0 (new r_ev_solar reward component)
#
# Root cause: R21 EV charging is anti-solar (r=-0.21 correlation, 28.6% solar hours).
# r_ev_solar rewards EV charging proportional to solar availability.
# All other hyperparameters identical to R21.

algo: PPOLagMulti
env_id: CityLearnSafety-V2G-v2
seed: 42

train_cfgs:
  total_steps: 787110          # 90 epochs × 8759 steps
  vector_env_nums: 1
  parallel: 1

algo_cfgs:
  steps_per_epoch: 8759
  update_iters: 30
  target_kl: 0.08              # R21: same
  kl_early_stop: true
  batch_size: 256              # R21: same
  obs_normalize: true
  reward_normalize: true
  cost_normalize: false
  standardized_cost_adv: true
  entropy_coef: 0.005
  max_grad_norm: 40.0

lagrange_cfgs:
  cost_limit: 21800
  lagrangian_multiplier_init: 0.001
  lambda_lr: 0.035
  lambda_optimizer: Adam
  lagrangian_upper_bound: 5.0  # R21: same

multi_cfgs:
  tau: 1.0
  cost_limit_0: 999999
  cost_limit_1: 1500
  cost_limit_2: 4000
  cost_limit_3: 3000
  cost_limit_4: 1500

  # Same curriculum as R21
  anneal_cost_limit_0: [999999, 1800, 20, 40]

  # PID gains (unchanged from R21)
  pid_kp: 0.1
  pid_ki: 0.01
  pid_kd: 0.01
  pid_d_delay: 10
  pid_delta_p_ema_alpha: 0.95
  pid_delta_d_ema_alpha: 0.95

  pid_kp_0: 5.0
  pid_ki_0: 0.0
  pid_kd_0: 0.0
  pid_ema_p_0: 0.0
  pid_kp_3: 0.5
  pid_ki_3: 0.05
  pid_kp_4: 0.3
  pid_ki_4: 0.03

model_cfgs:
  actor:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.0001              # R21: same
  critic:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.001
  linear_lr_decay: false

logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  save_model_freq: 5
  log_dir: ./runs/r23_ppo/5bld
  window_lens: 1
