# R26j: Lagrangian Fix + Trajectory Boost
# =========================================
# Based on R26h evaluation findings:
#   1. C0 curriculum broken (λ=0 for 40 epochs) → fix: immediate pressure
#   2. C3 limit not binding (cost < limit) → fix: tighten to 5000
#   3. r_trajectory invisible (0.3% of reward) → fix: alpha 2→20
#   4. Ki=0 causes λ oscillation → fix: Ki=0.05
#   5. penalty_max=10 saturated → fix: raise to 20
#
# Reward terms (same 5 as R26h, rebalanced):
#   r_sg (1.0), r_sb (2.0), r_ren (0.3), r_barrier (1.0), r_trajectory (20.0)
# =========================================
algo: PPOLagMulti
env_id: CityLearnSafety-V2G-v2
seed: 42

train_cfgs:
  device: cuda:0
  total_steps: 1051080       # 120 epochs * 8759 steps
  vector_env_nums: 1
  parallel: 1

algo_cfgs:
  steps_per_epoch: 8759
  update_iters: 10
  target_kl: 0.08
  kl_early_stop: true
  batch_size: 512
  obs_normalize: true
  reward_normalize: true
  cost_normalize: false
  standardized_cost_adv: true
  entropy_coef: 0.005
  max_grad_norm: 0.5

lagrange_cfgs:
  cost_limit: 21800
  lagrangian_multiplier_init: 0.001
  lambda_lr: 0.02
  lambda_optimizer: Adam
  lagrangian_upper_bound: 20.0          # was 10.0 — more headroom for C0

multi_cfgs:
  tau: 1.0

  # C0: EV departure — immediate pressure, tight limit
  cost_limit_0: 200                     # was 999999 — start binding immediately
  # C1: EV dense (unused)
  cost_limit_1: 999999
  # C2: Battery SoC band
  cost_limit_2: 1500
  # C3: Building power — TIGHTENED (was 15000, R26h cost=11841)
  cost_limit_3: 5000
  # C4: Grid power — slightly tightened
  cost_limit_4: 8000                    # was 10000

  # C0 curriculum: 200 → 30 over epochs 0-30
  anneal_cost_limit_0: [200, 30, 0, 30]

  # Default PID gains (for constraints without overrides)
  pid_kp: 0.1
  pid_ki: 0.01
  pid_kd: 0.01
  pid_d_delay: 10
  pid_delta_p_ema_alpha: 0.95
  pid_delta_d_ema_alpha: 0.95

  # C0: EV departure PID — lower Kp, add Ki for memory
  pid_kp_0: 3.0                         # was 5.0
  pid_ki_0: 0.05                        # was 0.0 — CRITICAL FIX
  pid_kd_0: 0.0
  pid_ema_p_0: 0.0

  # C3: Building power PID — stronger enforcement
  pid_kp_3: 0.5                         # was 0.3
  pid_ki_3: 0.05                        # was 0.03

  # C4: Grid power PID — moderate boost
  pid_kp_4: 0.3                         # was 0.2
  pid_ki_4: 0.03                        # was 0.02

model_cfgs:
  actor_type: gaussian_learning
  actor:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.0002
  critic:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.001
  linear_lr_decay: false

logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  save_model_freq: 5
  log_dir: ./runs/r26j_lagfix/5bld
  window_lens: 1
