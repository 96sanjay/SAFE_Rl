# R14: PID Lagrangian + V2G-aware reward + Sauté MDP
# Base: R13 (all 4 V2G fixes) + PID Lagrangian (Stooke et al., ICML 2020)
# Changes from R13:
#   - PID controller for lambda updates (prevents integral windup)
#   - Normalized delta by cost_limit (scale-invariant gains)
#   - Parent lagrange_cfgs kept for backward compatibility (SGD params ignored)
algo: PPOLagMulti
env_id: CityLearnSafety-V2G-v2
seed: 42

train_cfgs:
  total_steps: 437950          # 50 epochs × 8759 steps/epoch
  vector_env_nums: 1
  parallel: 1

algo_cfgs:
  steps_per_epoch: 8759
  update_iters: 30
  target_kl: 0.12
  kl_early_stop: true
  batch_size: 128
  obs_normalize: true
  reward_normalize: true
  cost_normalize: false
  standardized_cost_adv: true
  entropy_coef: 0.005
  max_grad_norm: 40.0

lagrange_cfgs:
  # SGD params for parent PPOLag compatibility (parent Lagrange ignores PID)
  cost_limit: 21800
  lagrangian_multiplier_init: 0.001
  lambda_lr: 0.035
  lambda_optimizer: Adam
  lagrangian_upper_bound: 3.0

multi_cfgs:
  tau: 1.0
  cost_limit_0: 1800           # C0: EV departure (PID Lagrangian)
  cost_limit_1: 1500           # C1: EV dense (Sauté — cost always 0)
  cost_limit_2: 4000           # C2: Battery SoC (inactive, weight=0)
  cost_limit_3: 12000          # C3: Building power
  cost_limit_4: 2500           # C4: Grid power

  # --- PID gains (used when CITYLEARN_PID_LAGRANGE=1) ---
  # Defaults (used for C1, C2, C4 which are fine with standard gains)
  pid_kp: 0.1
  pid_ki: 0.01
  pid_kd: 0.01
  pid_d_delay: 10
  pid_delta_p_ema_alpha: 0.95
  pid_delta_d_ema_alpha: 0.95

  # C0 override: pure proportional (no integral — avoids negative integral
  # windup from 40 epochs of being below limit before violation starts)
  # High Kp with no EMA = immediate response to small violations
  pid_kp_0: 5.0
  pid_ki_0: 0.0
  pid_kd_0: 0.0
  pid_ema_p_0: 0.0              # no EMA smoothing — instant response

  # C3 override: 3x stronger (C3 starts at 76K vs limit 12K, needs urgency)
  pid_kp_3: 0.3
  pid_ki_3: 0.03

model_cfgs:
  actor:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.0003
  critic:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.001
  linear_lr_decay: false

logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  save_model_freq: 5
  log_dir: ./runs/r14_pid_v2g/5bld
  window_lens: 1
