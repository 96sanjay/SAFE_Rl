# R28 CPPOPID benchmark: PPO + single PID Lagrangian
algo: CPPOPID
env_id: CityLearnSafety-V2G-v2
seed: 42

train_cfgs:
  device: cuda:0
  total_steps: 875900
  vector_env_nums: 1
  parallel: 1

algo_cfgs:
  steps_per_epoch: 8759
  update_iters: 40
  batch_size: 256
  target_kl: 0.02
  kl_early_stop: true
  entropy_coef: 0.005
  obs_normalize: true
  reward_normalize: true
  cost_normalize: false
  standardized_rew_adv: true
  standardized_cost_adv: true
  max_grad_norm: 0.5

lagrange_cfgs:
  pid_kp: 0.1
  pid_ki: 0.01
  pid_kd: 0.01
  pid_d_delay: 10
  pid_delta_p_ema_alpha: 0.95
  pid_delta_d_ema_alpha: 0.95
  sum_norm: true
  diff_norm: false
  cost_limit: 100000
  lagrangian_multiplier_init: 0.001
  penalty_max: 100.0

model_cfgs:
  actor_type: gaussian_learning
  actor:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.0003
  critic:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.001
  linear_lr_decay: false

logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  save_model_freq: 10
  log_dir: ./runs/benchmark_cppopid/5bld
  window_lens: 1
