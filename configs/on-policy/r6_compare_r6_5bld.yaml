# R6 on 5 buildings: StopIter fix + P0 (spatial obs) + P1 (controllable C3)
# Set CITYLEARN_C3_CONTROLLABLE=1 and CITYLEARN_SPATIAL_OBS=1 before running
algo: PPOLag
env_id: CityLearnSafety-V2G-v2
seed: 42

train_cfgs:
  total_steps: 437950          # 50 epochs × 8759 steps/epoch
  vector_env_nums: 1
  parallel: 1

algo_cfgs:
  steps_per_epoch: 8759
  update_iters: 60             # R5-A fix: working value function
  target_kl: 0.10
  kl_early_stop: true
  batch_size: 256
  obs_normalize: true
  reward_normalize: true
  cost_normalize: false
  entropy_coef: 0.005

lagrange_cfgs:
  cost_limit: 24400            # scaled from 83000 × (5/17)
  lagrangian_multiplier_init: 10.0
  lambda_lr: 0.05
  lambda_optimizer: SGD

model_cfgs:
  actor:
    # Same network as R5-A/R5-B for clean comparison (only P0+P1 differ)
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.0005
  critic:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.001
  linear_lr_decay: false

logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  save_model_freq: 5
  log_dir: ./runs/r6_compare/r6_5bld
  window_lens: 1
