algo: PPOLag
env_id: CityLearnSafety-SoC-v0
seed: 42
train_cfgs:
  total_steps: 175180
  vector_env_nums: 1
  parallel: 1
algo_cfgs:
  steps_per_epoch: 8759
  target_kl: 0.1             # INCREASED - allow bigger policy changes
  kl_early_stop: true
  batch_size: 256
  update_iters: 40
  obs_normalize: true
  reward_normalize: true
  cost_normalize: false
  entropy_coef: 0.01
lagrange_cfgs:
  cost_limit: 50000          # DECREASED - more aggressive target
  lagrangian_multiplier_init: 10.0   # INCREASED 10x - start with real pressure
  lambda_lr: 0.1             # INCREASED 10x - faster lambda growth
  lambda_optimizer: Adam
model_cfgs:
  actor:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.0005               # Slightly increased
  critic:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.001
  linear_lr_decay: false
logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  save_model_freq: 1
  log_dir: ./runs/ppo_lag_FIXED_SCALE_V4
  window_lens: 1
