algo: RCPO
env_id: CityLearnSafety-SoC-v0
seed: 42

train_cfgs:
  total_steps: 875900
  vector_env_nums: 1
  parallel: 1
  device: cpu
  torch_threads: 4

algo_cfgs:
  steps_per_epoch: 8759
  update_iters: 80
  batch_size: 1024

  obs_normalize: true
  reward_normalize: false
  cost_normalize: false

  use_critic_norm: true
  entropy_coef: 0.01

lagrange_cfgs:
  cost_limit: 20000.0
  lagrangian_multiplier_init: 10.0
  lambda_lr: 0.05
  lambda_optimizer: SGD

model_cfgs:
  actor:
    hidden_sizes: [512, 512, 256]
    activation: tanh
    lr: 0.0003
  critic:
    hidden_sizes: [512, 512, 256]
    activation: tanh
    lr: 0.001

logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  save_model_freq: 5
  log_dir: ./runs/rcpo_aggressive_v2
  window_lens: 1
