# R22: PPOLagMulti + GradS + Lambda Cap 12.0
#
# Builds directly on R21 (which fixed KL instability and Safety Projection for C2).
# R21 diagnosis at ep 34:
#   - C3=35,369 and C4=18,459 declining but FLATTENING in Phase 2
#   - λ3=λ4=5.0 saturated since epoch 3 (same cap problem, higher ceiling)
#   - Phase 2 C0 annealing competing with C3/C4 (78% slowdown confirmed in R20)
#   - Root cause: C0 gradient conflicts with C3/C4 gradients in Phase 2
#
# R22 Fixes on top of R21:
#   1. GradS: gradient surgery in gradient space — detects and resolves
#      gradient conflicts between constraints per mini-batch.
#      Implementation: integrated into PPOLagMulti (preserves PID + curriculum).
#      Key benefit for Phase 2: when C0 gradient conflicts with C3/C4,
#      GradS picks the non-conflicting one, preventing Phase 2 stall.
#   2. lambda_upper_bound 5.0 → 12.0: more pressure headroom for Phase 3.
#      At cap=5.0 with Kp=0.5 and δ≈10 (C3 at 35k vs limit 3k),
#      P-term alone saturates the cap. Cap=12.0 allows I-term to grow.
#   3. 120 epochs (R21 showed Phase 3 needs more time to converge).
#
# Unchanged from R21:
#   - actor_lr 0.0001 (fixed 65% wasted epochs)
#   - target_kl 0.08, batch_size 256 (stable trust region)
#   - BATT_CLAMP=1 (Safety Projection for C2 — λ2=0.000 all epochs)
#   - Same curriculum schedule (Phase 2 ep 20-40)
#   - Same PID gains
#   - Same reward config

algo: PPOLagMulti
env_id: CityLearnSafety-V2G-v2
seed: 42

train_cfgs:
  total_steps: 1051080         # 120 epochs × 8759 steps
  vector_env_nums: 1
  parallel: 1

algo_cfgs:
  steps_per_epoch: 8759
  update_iters: 30
  target_kl: 0.08
  kl_early_stop: true
  batch_size: 256
  obs_normalize: true
  reward_normalize: true
  cost_normalize: false
  standardized_cost_adv: true
  entropy_coef: 0.005
  max_grad_norm: 40.0

lagrange_cfgs:
  cost_limit: 21800
  lagrangian_multiplier_init: 0.001
  lambda_lr: 0.035
  lambda_optimizer: Adam
  lagrangian_upper_bound: 12.0   # R22: 5.0→12.0 (2.4× more headroom before saturation)

multi_cfgs:
  tau: 1.0
  cost_limit_0: 999999
  cost_limit_1: 1500
  cost_limit_2: 4000
  cost_limit_3: 3000
  cost_limit_4: 1500

  # Same curriculum as R21
  anneal_cost_limit_0: [999999, 1800, 20, 40]

  # PID gains (unchanged from R21)
  pid_kp: 0.1
  pid_ki: 0.01
  pid_kd: 0.01
  pid_d_delay: 10
  pid_delta_p_ema_alpha: 0.95
  pid_delta_d_ema_alpha: 0.95

  pid_kp_0: 5.0
  pid_ki_0: 0.0
  pid_kd_0: 0.0
  pid_ema_p_0: 0.0
  pid_kp_3: 0.5
  pid_ki_3: 0.05
  pid_kp_4: 0.3
  pid_ki_4: 0.05

  # R22: GradS gradient surgery
  use_grads: true
  grads_sim_threshold: 0.8       # cosine > 0.8 → redundant (skip one)
  grads_conflict_threshold: 0.999 # cosine < -0.999 → conflicting (skip conflicting)
  grads_sampling: lambda          # sample proportional to λ_i (most-violated first)

model_cfgs:
  actor:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.0001
  critic:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.001
  linear_lr_decay: false

logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  save_model_freq: 5
  log_dir: ./runs/r22_ppo/5bld
  window_lens: 1
