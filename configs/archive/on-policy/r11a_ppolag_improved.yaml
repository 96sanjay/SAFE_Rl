# R11a: PPOLag (single lambda) + Step 1 improvements
# A/B comparison Run A — baseline single-lambda with:
#   - r_ev removed (C1 handles EV in CMDP cost)
#   - SoC safety clamp (hard guarantee)
#   - SoC barrier reward (alpha=0.5)
#   - C2 zeroed (redundant with clamp+barrier)
#   - Lambda cap at 1.0 (prevents death spiral)
# Architecture: MLP (isolate lambda mechanism comparison)
algo: PPOLag
env_id: CityLearnSafety-V2G-v2
seed: 42

train_cfgs:
  total_steps: 437950          # 50 epochs × 8759 steps/epoch
  vector_env_nums: 1
  parallel: 1

algo_cfgs:
  steps_per_epoch: 8759
  update_iters: 30
  target_kl: 0.12
  kl_early_stop: true
  batch_size: 128
  obs_normalize: true
  reward_normalize: true
  cost_normalize: true
  entropy_coef: 0.005

lagrange_cfgs:
  cost_limit: 400000
  lagrangian_multiplier_init: 0.1
  lambda_lr: 0.0005
  lambda_optimizer: SGD

model_cfgs:
  actor:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.0003
  critic:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.001
  linear_lr_decay: false

logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  save_model_freq: 5
  log_dir: ./runs/r11a_ppolag_improved/5bld
  window_lens: 1
