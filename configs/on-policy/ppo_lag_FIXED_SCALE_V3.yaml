algo: PPOLag
env_id: CityLearnSafety-SoC-v0
seed: 42
train_cfgs:
  total_steps: 87590
  vector_env_nums: 1
  parallel: 1
algo_cfgs:
  steps_per_epoch: 8759
  target_kl: 0.05            # INCREASED from 0.02 - allows more updates
  kl_early_stop: true
  batch_size: 256
  update_iters: 40           # INCREASED - more update attempts per epoch
  obs_normalize: true
  reward_normalize: true
  cost_normalize: false
  entropy_coef: 0.01
lagrange_cfgs:
  cost_limit: 70000          # DECREASED - below current 109k to create pressure
  lagrangian_multiplier_init: 1.0    # INCREASED - start with some constraint pressure
  lambda_lr: 0.01            # INCREASED - faster lambda adaptation
  lambda_optimizer: Adam
model_cfgs:
  actor:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.0003
  critic:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.001
  linear_lr_decay: false
logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  save_model_freq: 1
  log_dir: ./runs/ppo_lag_FIXED_SCALE_V3
  window_lens: 1
