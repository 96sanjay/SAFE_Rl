algo: PCPO
env_id: CityLearnSafety-SoC-v0

train_cfgs:
  total_steps: 87590
  vector_env_nums: 1
  parallel: 1

algo_cfgs:
  steps_per_epoch: 8759            # keeps epoch = 1 full episode
  target_kl: 0.05                  #  relax a bit to reduce early stops
  kl_early_stop: true              # keep true; target_kl↑ will already help
  batch_size: 128                  #  slightly larger minibatches = smoother updates
  update_iters: 30                 # fewer max passes; less chance to slam KL
  obs_normalize: true
  reward_normalize: true
  cost_normalize: true             # the build supports it; helps cost critic
  entropy_coef: 0.005              #  gentle exploration without blowing up KL

logger_cfgs:
  use_wandb: false
  use_tensorboard: true

