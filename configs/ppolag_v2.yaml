algo: PPOLag
env_id: CityLearnSafety-V2G-v2

train_cfgs:
  total_steps: 2190000
  vector_env_nums: 1
  parallel: 1
  torch_threads: 4

algo_cfgs:
  steps_per_epoch: 8760
  update_iters: 40
  batch_size: 512
  use_max_grad_norm: true
  max_grad_norm: 0.5
  use_critic_norm: true
  critic_norm_coeff: 0.001
  gamma: 0.995
  cost_gamma: 0.99
  lam: 0.95
  lam_c: 0.95
  clip: 0.2
  kl_early_stop: 0.02

model_cfgs:
  actor_type: gaussian_learning
  linear_lr_decay: false
  actor:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.0003
  critic:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.001

lagrange_cfgs:
  cost_limit: 5.0
  lagrangian_multiplier_init: 1.0
  lambda_lr: 0.035
  lambda_optimizer: Adam

logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  log_dir: ./runs/ppolag_v2
  save_model_freq: 10
  window_lens: 10
