# SACLagMulti: Algorithm ablation (5-building, R21 reward terms)
# Same constraints, reward, schema as R21 PPOLagMulti — only the algorithm differs.
#
# Key SAC-specific settings adapted for 5-building (8759 steps/episode):
#   - steps_per_epoch: 8759 (full year)
#   - replay buffer: 500000 (~57 episodes)
#   - start_learning_steps: 8759 (1 full episode of random exploration)
#   - total_steps: 787110 (90 epochs, same as R21)

algo: SACLagMulti
env_id: CityLearnSafety-V2G-v2
seed: 42

train_cfgs:
  total_steps: 787110           # 90 epochs x 8759 (same as R21)
  vector_env_nums: 1
  parallel: 1

algo_cfgs:
  steps_per_epoch: 8759         # full year episode
  update_cycle: 1               # update every step
  update_iters: 1               # 1 gradient step per update
  size: 500000                  # replay buffer (~57 episodes)
  batch_size: 256               # same as R21
  reward_normalize: false
  cost_normalize: false
  obs_normalize: true           # same as R21
  max_grad_norm: 40.0           # same as R21
  polyak: 0.005                 # soft target update
  gamma: 0.99
  start_learning_steps: 8759    # 1 full episode random exploration
  policy_delay: 2               # update actor every 2 critic updates
  use_exploration_noise: false   # SAC entropy handles exploration
  alpha: 0.2                    # initial entropy coefficient
  auto_alpha: true              # auto-tune entropy
  use_cost: true
  warmup_epochs: 5              # don't update lambdas for first 5 epochs

model_cfgs:
  weight_initialization_mode: kaiming_uniform
  actor_type: gaussian_sac
  linear_lr_decay: false
  actor:
    hidden_sizes: [256, 256]    # same architecture as R21
    activation: relu            # SAC standard (R21 PPO uses tanh)
    lr: 0.0003                  # SAC standard
  critic:
    num_critics: 2              # twin Q-critics (SAC standard)
    hidden_sizes: [256, 256]
    activation: relu
    lr: 0.0003

lagrange_cfgs:
  cost_limit: 21800             # same as R21
  lagrangian_multiplier_init: 0.001
  lambda_lr: 0.035              # same as R21
  lambda_optimizer: Adam
  lagrangian_upper_bound: 5.0   # same as R21

# Per-constraint limits IDENTICAL to R21
multi_cfgs:
  tau: 1.0
  cost_limit_0: 999999          # C0: curriculum handles this
  cost_limit_1: 1500            # C1: EV dense
  cost_limit_2: 4000            # C2: Battery SoC
  cost_limit_3: 3000            # C3: Building power
  cost_limit_4: 1500            # C4: Grid power

  anneal_cost_limit_0: [999999, 1800, 20, 40]  # same curriculum as R21

  # PID gains IDENTICAL to R21
  pid_kp: 0.1
  pid_ki: 0.01
  pid_kd: 0.01
  pid_d_delay: 10
  pid_delta_p_ema_alpha: 0.95
  pid_delta_d_ema_alpha: 0.95
  pid_kp_0: 5.0
  pid_ki_0: 0.0
  pid_kd_0: 0.0
  pid_ema_p_0: 0.0
  pid_kp_3: 0.5
  pid_ki_3: 0.05
  pid_kp_4: 0.3
  pid_ki_4: 0.03

logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  save_model_freq: 5
  log_dir: ./runs/ablation_sac_5bld/5bld
  window_lens: 1
