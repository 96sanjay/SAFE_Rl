# PPOLag-Multi v5: Fixed CMDP Lagrangian (no reward extinction)
#
# v5 fixes from v3a:
#   1. REMOVED /(1+sum_lambda) normalization — was killing 90%+ of reward signal
#   2. Lambda cap: lagrangian_upper_bound=3.0 per constraint (prevents runaway,
#      worst-case 3:1 cost:reward ratio keeps reward signal meaningful)
#   3. C4 limit relaxed: 1400 → 2500 (C0/C1 EV charging causes grid import,
#      making 1400 infeasible — relaxed but lambda won't collapse to 0)
#   5. Lambda init: 1.0 → 0.1 (let lambdas grow naturally, don't crush policy
#      before it learns useful behavior — OmniSafe default is 0.001)
#   4. Reward rebalancing: LAMBDA_EV 5.0→1.5, ALPHA_BUILD 2.0→6.0
#      (fix solar absorption, reduce EV double-counting with constraints)
#
# Evidence-based changes:
#   - v3a sum_lambda=9.2 at epoch 99, reward fraction=9.8% → agent couldn't learn
#   - v3a C4 cost=18,181 vs limit=1,400 (13x over) → infeasible with EV charging
#   - C3 physical floor=1.5%, greedy=15.7%, v3a=33% → r_sb boost should help
#   - R5a deprioritizes C3 (weight 0.1) → lambda cap prevents C3 from dominating
#
# Per-constraint cost limits:
#   C0 (EV departure):    R5a=2075,  limit=1800  (-13%, beat R5a)
#   C1 (EV dense):        R5a=1700,  limit=1500  (-12%, beat R5a)
#   C2 (Battery SoC):     R5a=4459,  limit=4000  (-10%, beat R5a)
#   C3 (Building power):  R5a=16782, limit=12000 (-29%, aggressive push)
#   C4 (Grid power):      R5a=1589,  limit=2500  (relaxed — feasibility)
algo: PPOLagMulti
env_id: CityLearnSafety-V2G-v2
seed: 42

train_cfgs:
  total_steps: 437950          # 50 epochs x 8759 steps/epoch
  vector_env_nums: 1
  parallel: 1

algo_cfgs:
  steps_per_epoch: 8759
  update_iters: 60
  target_kl: 0.10
  kl_early_stop: true
  batch_size: 256
  obs_normalize: true
  reward_normalize: true
  cost_normalize: false
  standardized_cost_adv: true  # Z-score per-constraint advantages
  entropy_coef: 0.005
  max_grad_norm: 40.0

lagrange_cfgs:
  cost_limit: 21800                      # Sum of per-constraint limits (logging only)
  lagrangian_multiplier_init: 0.1
  lambda_lr: 0.035                       # Adam: effective step ~0.035/epoch
  lambda_optimizer: Adam
  lagrangian_upper_bound: 3.0            # Cap each lambda at 3.0 (max sum=15, worst 3:1 ratio)

multi_cfgs:
  tau: 1.0

  # Per-constraint limits
  cost_limit_0: 1800           # C0: EV departure (R5a=2075, -13%)
  cost_limit_1: 1500           # C1: EV dense (R5a=1700, -12%)
  cost_limit_2: 4000           # C2: Battery SoC (R5a=4459, -10%)
  cost_limit_3: 12000          # C3: Building power (R5a=16782, -29%)
  cost_limit_4: 2500           # C4: Grid power (relaxed for feasibility)

model_cfgs:
  actor:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.0002
  critic:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.001
  linear_lr_decay: false

logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  save_model_freq: 5
  log_dir: ./runs/multi_lag_v5/5bld
  window_lens: 1
