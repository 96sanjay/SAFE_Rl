# R25b report-stable clean no-Saute / no-C1 ablation.
# Purpose:
#   Remove the full Sauté branch and explicitly disable the dense EV constraint
#   channel as well, so the ablation answers a clean question:
#     "Did the Sauté + C1-dense branch matter at all?"
#
# Compared with r25b_report_stable:
#   - CITYLEARN_EV_SAUTE=0 (wrapper removed, no extra obs dim)
#   - CITYLEARN_EV_DENSE_COST_SCALE=0.0 (dense EV fallback remains off)
#   - cost_limit_1=999999 (C1-dense explicitly disabled in MultiLag too)
algo: PPOLagMulti
env_id: CityLearnSafety-V2G-v2
seed: 42

train_cfgs:
  total_steps: 700720
  vector_env_nums: 1
  parallel: 1
  device: cuda:0

algo_cfgs:
  steps_per_epoch: 8759
  update_iters: 10
  target_kl: 0.06
  kl_early_stop: true
  batch_size: 256
  obs_normalize: true
  reward_normalize: true
  cost_normalize: false
  standardized_cost_adv: true
  entropy_coef: 0.005
  max_grad_norm: 0.5

lagrange_cfgs:
  cost_limit: 21800
  lagrangian_multiplier_init: 0.001
  lambda_lr: 0.02
  lambda_optimizer: Adam
  lagrangian_upper_bound: 3.0

multi_cfgs:
  tau: 1.0
  cost_limit_0: 999999
  cost_limit_1: 999999
  cost_limit_2: 4000
  cost_limit_3: 3000
  cost_limit_4: 1500

  anneal_cost_limit_0: [999999, 1800, 20, 40]

  pid_kp: 0.1
  pid_ki: 0.01
  pid_kd: 0.01
  pid_d_delay: 10
  pid_delta_p_ema_alpha: 0.95
  pid_delta_d_ema_alpha: 0.95

  pid_kp_0: 5.0
  pid_ki_0: 0.0
  pid_kd_0: 0.0
  pid_ema_p_0: 0.0
  pid_kp_3: 0.3
  pid_ki_3: 0.03
  pid_kp_4: 0.2
  pid_ki_4: 0.02

model_cfgs:
  actor:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.0003
  critic:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.001
  linear_lr_decay: false

logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  save_model_freq: 5
  log_dir: ./runs/r25b_report_stable_nosaute_no_c1_clean/5bld
  window_lens: 1
