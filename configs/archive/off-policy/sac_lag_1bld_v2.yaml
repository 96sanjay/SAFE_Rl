# SACLagMulti config for 1-building V2G problem
# Off-policy Safe RL with per-constraint Lagrange multipliers
#
# Based on OmniSafe's SACLag defaults, merged via train_sac_lag.py
# (bypasses Agent API to support multi_cfgs and custom algorithm).
algo: SACLagMulti
env_id: CityLearnSafety-V2G-v2
seed: 42

train_cfgs:
  total_steps: 109500          # 50 epochs x 2190 steps/epoch
  vector_env_nums: 1
  parallel: 1
  eval_episodes: 1

algo_cfgs:
  steps_per_epoch: 2190        # 1 episode = 2190 steps (1-building, 3-month schema)
  update_cycle: 1              # update every step (standard SAC)
  update_iters: 1              # 1 gradient step per update
  size: 100000                 # replay buffer (~45 episodes)
  batch_size: 256
  reward_normalize: false
  cost_normalize: false
  obs_normalize: false
  max_grad_norm: 40.0
  polyak: 0.005                # soft target update rate
  gamma: 0.99
  start_learning_steps: 2190   # 1 full episode of random exploration
  policy_delay: 2              # update actor every 2 critic updates
  use_exploration_noise: false  # SAC uses entropy, not explicit noise
  alpha: 0.2                   # initial entropy coefficient
  auto_alpha: true             # let SAC tune entropy automatically
  use_cost: true
  warmup_epochs: 5             # don't update lambdas for first 5 epochs

model_cfgs:
  weight_initialization_mode: kaiming_uniform
  actor_type: gaussian_sac
  linear_lr_decay: false
  actor:
    hidden_sizes: [256, 256]
    activation: relu
    lr: 0.0003
  critic:
    num_critics: 2
    hidden_sizes: [256, 256]
    activation: relu
    lr: 0.0003

lagrange_cfgs:
  cost_limit: 80.0             # combined cost limit (for parent SACLag compat)
  lagrangian_multiplier_init: 0.001
  lambda_lr: 0.001             # conservative
  lambda_optimizer: Adam
  lagrangian_upper_bound: 3.0  # cap lambda to prevent explosion

# Per-constraint multi-lambda settings (same structure as PPOLagMulti)
multi_cfgs:
  tau: 1.0                     # softmax temperature (1.0 = moderate focus)
  # Per-constraint cost limits (from v4 config)
  cost_limit_0: 80             # C0: EV departure
  cost_limit_1: 50             # C1: EV dense
  cost_limit_2: 10000          # C2: Battery SoC (mask handles bounds)
  cost_limit_3: 5000           # C3: Building power (structural floor)
  cost_limit_4: 3000           # C4: Grid power (structural floor)

  # PID gains (used when CITYLEARN_PID_LAGRANGE=1)
  pid_kp: 0.1
  pid_ki: 0.01
  pid_kd: 0.01
  pid_d_delay: 10
  pid_delta_p_ema_alpha: 0.95
  pid_delta_d_ema_alpha: 0.95
  pid_kp_0: 0.3               # C0: stronger proportional response
  pid_ki_0: 0.0
  pid_kd_0: 0.0
  pid_ema_p_0: 0.0
  pid_kp_3: 0.2               # C3: moderate
  pid_ki_3: 0.02
  pid_kp_4: 0.2               # C4: moderate
  pid_ki_4: 0.02

logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  save_model_freq: 10
  log_dir: ./runs/sac_lag_1bld_v2
  window_lens: 1
