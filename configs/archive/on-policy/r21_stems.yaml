# R21: STEMS GCN-Transformer + PPOLagMulti — Raised Lambda Cap
# Key fix: lambda_upper_bound 3.0 → 12.0 (bottleneck identified by analyze_r20.py)
#
# Root cause: Lambda_3 and Lambda_4 were saturated at cap=3.0 from epoch 1-3.
# Agent always saw CONSTANT max penalty — no increasing pressure as costs remained
# above limit. Exponential asymptote: C3→25760 (8.6x target), C4→7838 (5.2x target).
# Raising cap to 12.0 gives 4x more gradient pressure when costs exceed limits.
#
# Other changes from R20:
#   1. lambda_upper_bound: 3.0 → 12.0
#   2. Extended to 120 epochs (R20 shows costs still declining at ep 80)
#   3. Phase 2 (C0 annealing) delayed: ep 20-40 → ep 40-60
#      (C3 decline SLOWED 78% when Phase 2 started in R20; give Phase 1 more time)
#   4. Slightly higher pid_ki_4 for faster C4 I-term buildup

algo: PPOLagMulti
env_id: CityLearnSafety-V2G-v2
seed: 42

train_cfgs:
  device: cuda                 # GPU training (same as R20)
  total_steps: 1051080         # 120 epochs × 8759 steps/epoch
  vector_env_nums: 1
  parallel: 1

algo_cfgs:
  steps_per_epoch: 8759
  update_iters: 30
  target_kl: 0.12
  kl_early_stop: true
  batch_size: 128
  obs_normalize: true
  reward_normalize: true
  cost_normalize: false
  standardized_cost_adv: true
  entropy_coef: 0.005
  max_grad_norm: 40.0

lagrange_cfgs:
  cost_limit: 21800
  lagrangian_multiplier_init: 0.001
  lambda_lr: 0.035
  lambda_optimizer: Adam
  lagrangian_upper_bound: 12.0   # R21: raised from 3.0 (KEY FIX)

multi_cfgs:
  tau: 1.0
  cost_limit_0: 999999
  cost_limit_1: 1500
  cost_limit_2: 4000
  cost_limit_3: 3000
  cost_limit_4: 1500

  # R21: Curriculum delayed — Phase 2 starts at ep 40 (was 20 in R20)
  # Rationale: C3 decline slowed 78% when Phase 2 (C0 annealing) started in R20.
  # Giving 20 more Phase 1 epochs lets C3/C4 converge further before C0 pressure.
  anneal_cost_limit_0: [999999, 1800, 40, 60]

  # PID gains (mostly unchanged from R20)
  pid_kp: 0.1
  pid_ki: 0.01
  pid_kd: 0.01
  pid_d_delay: 10
  pid_delta_p_ema_alpha: 0.95
  pid_delta_d_ema_alpha: 0.95

  pid_kp_0: 5.0
  pid_ki_0: 0.0
  pid_kd_0: 0.0
  pid_ema_p_0: 0.0
  pid_kp_3: 0.5
  pid_ki_3: 0.05
  pid_kp_4: 0.3
  pid_ki_4: 0.05   # R21: raised from 0.03 — C4 I-term builds up faster

model_cfgs:
  actor_type: gaussian_learning
  actor:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.0003
  critic:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.001
  linear_lr_decay: false

logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  save_model_freq: 5
  log_dir: ./runs/r21_stems/5bld
  window_lens: 1
