algo: FOCOPS
env_id: CityLearnSafety-V2G-v2-shield
seed: 42
train_cfgs:
  total_steps: 876000
  vector_env_nums: 1
  parallel: 1
  torch_threads: 4
algo_cfgs:
  steps_per_epoch: 8760
  update_iters: 10
  batch_size: 2048
  gamma: 0.995
  cost_gamma: 0.99
  lam: 0.95
  lam_c: 0.95
  clip: 0.2
  target_kl: 0.1
  kl_early_stop: true
  use_max_grad_norm: true
  max_grad_norm: 40.0
  use_critic_norm: true
  critic_norm_coef: 0.001
  obs_normalize: true
  reward_normalize: true
  cost_normalize: true
  entropy_coef: 0.01
  focops_eta: 0.02
  focops_lam: 1.5
  penalty_coef: 0.0
  standardized_cost_adv: true
  standardized_rew_adv: true
model_cfgs:
  actor_type: gaussian_learning
  linear_lr_decay: false
  actor:
    hidden_sizes: [512, 256]
    activation: tanh
    lr: 0.0003
  critic:
    hidden_sizes: [512, 256]
    activation: tanh
    lr: 0.001
lagrange_cfgs:
  cost_limit: 5.0
  lagrangian_multiplier_init: 0.1
  lambda_lr: 0.01
  lambda_optimizer: Adam
logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  log_dir: ./runs/focops_v2_shield_100ep_v6style
  save_model_freq: 10
  window_lens: 10
