# ABLATION: R28 with 3-month episodes, C3/C4 DISABLED (limits=999999)
# Purpose: prove C3/C4 Lagrangian kills battery cycling
# If cycling persists here but not in control → C3/C4 is the cause
algo: PPOLagMulti
env_id: CityLearnSafety-V2G-v2
seed: 42

train_cfgs:
  total_steps: 32850          # 15 epochs × 2190 steps/epoch
  vector_env_nums: 1
  parallel: 1

algo_cfgs:
  steps_per_epoch: 2190
  update_iters: 30
  target_kl: 0.08
  kl_early_stop: true
  batch_size: 256
  obs_normalize: true
  reward_normalize: true
  cost_normalize: false
  standardized_cost_adv: true
  entropy_coef: 0.005
  max_grad_norm: 40.0

lagrange_cfgs:
  cost_limit: 21800
  lagrangian_multiplier_init: 0.001
  lambda_lr: 0.035
  lambda_optimizer: Adam
  lagrangian_upper_bound: 3.0

multi_cfgs:
  tau: 1.0
  cost_limit_0: 999999        # C0 disabled
  cost_limit_1: 375           # scaled 1500 × 0.25
  cost_limit_2: 1000          # scaled 4000 × 0.25
  cost_limit_3: 999999        # C3 DISABLED — lambda stays ~0
  cost_limit_4: 999999        # C4 DISABLED — lambda stays ~0

  pid_kp: 0.1
  pid_ki: 0.01
  pid_kd: 0.01
  pid_d_delay: 10
  pid_delta_p_ema_alpha: 0.95
  pid_delta_d_ema_alpha: 0.95
  pid_kp_0: 5.0
  pid_ki_0: 0.0
  pid_kd_0: 0.0
  pid_ema_p_0: 0.0
  pid_kp_3: 0.5
  pid_ki_3: 0.05
  pid_kp_4: 0.3
  pid_ki_4: 0.03

model_cfgs:
  actor:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.0003
  critic:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.001
  linear_lr_decay: false

logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  save_model_freq: 5
  log_dir: ./runs/ablation_c3c4_v2/disabled
  window_lens: 1
