# FOCOPS configuration for 100 epochs with balanced scales & realistic thresholds
algo: FOCOPS
env_id: CityLearnSafety-SoC-v0
seed: 42

train_cfgs:
  total_steps: 875900          # 100 epochs × 8759 steps/epoch
  vector_env_nums: 1
  parallel: 1

algo_cfgs:
  steps_per_epoch: 8759
  target_kl: 0.10
  kl_early_stop: true
  batch_size: 256
  update_iters: 60            # more updates per epoch
  obs_normalize: true
  reward_normalize: true
  cost_normalize: false
  entropy_coef: 0.005
  focops_eta: 0.02            # penalty strength (tune if needed)

lagrange_cfgs:
  cost_limit: 83000          # achievable target
  lagrangian_multiplier_init: 10.0
  lambda_lr: 0.05             # SGD step for λ
  lambda_optimizer: SGD

model_cfgs:
  actor:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.0005
  critic:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.001
  linear_lr_decay: false

logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  save_model_freq: 5
  log_dir: ./runs/focops_P95_FINAL
  window_lens: 1

