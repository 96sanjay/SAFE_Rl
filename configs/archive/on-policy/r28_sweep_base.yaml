# R28 Sweep Base: template for Optuna hyperparameter sweep
# =========================================================
# Based on R28b. Device: cpu (GPU reserved for top candidates).
# Total steps: 40 epochs * 8759 = 350360.
# Fields marked "# SWEEP" are overridden per-trial by optuna_ppo_sweep.py.
# =========================================================
algo: PPOLagMulti
env_id: CityLearnSafety-V2G-v2
seed: 42                                  # SWEEP

train_cfgs:
  device: cpu
  total_steps: 350360                     # 40 epochs
  vector_env_nums: 1
  parallel: 1

algo_cfgs:
  steps_per_epoch: 8759
  update_iters: 10
  target_kl: 0.06
  kl_early_stop: true
  batch_size: 256                         # SWEEP
  obs_normalize: true
  reward_normalize: true
  cost_normalize: false
  standardized_cost_adv: true
  entropy_coef: 0.005
  max_grad_norm: 0.5

lagrange_cfgs:
  cost_limit: 21800
  lagrangian_multiplier_init: 0.001
  lambda_lr: 0.02
  lambda_optimizer: Adam
  lagrangian_upper_bound: 25.0            # SWEEP

multi_cfgs:
  tau: 1.0

  # Per-constraint cost limits                # SWEEP
  cost_limit_0: 100
  cost_limit_1: 999999
  cost_limit_2: 3500
  cost_limit_3: 18000
  cost_limit_4: 13000

  # PID defaults
  pid_kp: 0.1
  pid_ki: 0.01
  pid_kd: 0.01
  pid_d_delay: 10
  pid_delta_p_ema_alpha: 0.95
  pid_delta_d_ema_alpha: 0.95

  # C0: fixed (working)
  pid_kp_0: 2.0
  pid_ki_0: 0.05
  pid_kd_0: 0.0
  pid_ema_p_0: 0.0

  # C2: fixed (working)
  pid_kp_2: 0.1
  pid_ki_2: 0.01

  # C3: SWEEP
  pid_kp_3: 0.1
  pid_ki_3: 0.01
  pid_kd_3: 0.0

  # C4: SWEEP
  pid_kp_4: 0.1
  pid_ki_4: 0.01

model_cfgs:
  actor_type: gaussian_learning
  actor:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.0003
  critic:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.001
  linear_lr_decay: false

logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  save_model_freq: 40
  log_dir: ./runs/optuna_r28_sweep          # SWEEP (per-trial)
  window_lens: 1
