algo: PPOLag
env_id: CityLearnSafety-SoC-v0
seed: 42

train_cfgs:
  total_steps: 43800         # 5 epochs
  vector_env_nums: 1
  parallel: 1

algo_cfgs:
  steps_per_epoch: 8759
  target_kl: 0.05
  kl_early_stop: true
  batch_size: 128
  update_iters: 40
  obs_normalize: true
  reward_normalize: true
  cost_normalize: false
  entropy_coef: 0.005

lagrange_cfgs:
  cost_limit: 70           # Target: ~12% of initial cost (21 → 2.5)
  lagrangian_multiplier_init: 70.0
  lambda_lr: 1.0
  lambda_optimizer: Adam

model_cfgs:
  actor:
    hidden_sizes: [128, 128]
    activation: tanh
    lr: 0.0005
  critic:
    hidden_sizes: [128, 128]
    activation: tanh
    lr: 0.002
  linear_lr_decay: false

logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  save_model_freq: 1
  log_dir: ./runs/ppo_lag_TRIAL_BALANCED_V1
  window_lens: 1
