# R26g: STEMS Critic + 2-Layer Temporal Transformer + Partial Obs Norm
# =======================================================================
# FIXES from R26f diagnosis:
#   1. STEMS-based critic (actor-critic parity for temporal planning)
#   2. 2-layer transformer + mean-pool (compositional temporal reasoning)
#   3. Partial obs normalization (preserve temporal patterns)
#   4. Gate monitoring (detect temporal signal suppression)
#
# RESTORED from R26e: full reward suite (R26f's reward stripping was
# counterproductive — 162K-param STEMS encoder needs MORE signal, not less)
#
# SAME constraints as R26f: curriculum C0, PID Lagrangian per-constraint
# =======================================================================
algo: PPOLagMulti
env_id: CityLearnSafety-V2G-v2
seed: 42

train_cfgs:
  device: cuda:0
  total_steps: 1051080       # 120 epochs * 8759 steps
  vector_env_nums: 1
  parallel: 1

algo_cfgs:
  steps_per_epoch: 8759
  update_iters: 10
  target_kl: 0.08            # Between R26e(0.06) and R26f(0.12) — stable StopIter
  kl_early_stop: true
  batch_size: 512             # Keep 512 from R26f (smoother gradients for STEMS)
  obs_normalize: true         # Will be partially applied via --partial_obs_norm
  reward_normalize: true
  cost_normalize: false
  standardized_cost_adv: true
  entropy_coef: 0.005
  max_grad_norm: 0.5

lagrange_cfgs:
  cost_limit: 21800
  lagrangian_multiplier_init: 0.001
  lambda_lr: 0.02
  lambda_optimizer: Adam
  lagrangian_upper_bound: 10.0

multi_cfgs:
  tau: 1.0
  cost_limit_0: 999999
  cost_limit_1: 999999       # C1 disabled
  cost_limit_2: 1500
  cost_limit_3: 15000
  cost_limit_4: 10000

  anneal_cost_limit_0: [999999, 50, 20, 40]

  pid_kp: 0.1
  pid_ki: 0.01
  pid_kd: 0.01
  pid_d_delay: 10
  pid_delta_p_ema_alpha: 0.95
  pid_delta_d_ema_alpha: 0.95

  pid_kp_0: 5.0
  pid_ki_0: 0.0
  pid_kd_0: 0.0
  pid_ema_p_0: 0.0
  pid_kp_3: 0.3
  pid_ki_3: 0.03
  pid_kp_4: 0.2
  pid_ki_4: 0.02

model_cfgs:
  actor_type: gaussian_learning
  actor:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.0002                # Between R26e(3e-4) and R26f(1e-4)
  critic:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.001
  linear_lr_decay: false

logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  save_model_freq: 5
  log_dir: ./runs/r26g_stems_critic/5bld
  window_lens: 1
