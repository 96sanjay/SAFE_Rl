# PPOLag + GradS v2: Fixed sign bug + tight per-constraint limits
# Changes from v1:
#   1. CRITICAL: Fixed gradient sign (was subtracting cost grad, now adding)
#   2. Per-constraint limits tightened to achievable range (with 30-50% slack)
#   3. lambda_lr: 0.05 → 0.0001 (prevents lambda explosion)
#   4. lambda_init: 0.1 → 1.0 (GradS has non-zero weights from epoch 0)
#   5. lagrangian_upper_bound: 50.0 (safety cap on lambda growth)
#   6. conflict_threshold: 0.999 → 0.5 (enables real conflict detection)
#   7. combined cost_limit: 999999 (disabled — GradS uses per-constraint only)
algo: PPOLagGradS
env_id: CityLearnSafety-V2G-v2
seed: 42

train_cfgs:
  total_steps: 437950          # 50 epochs x 8759 steps/epoch
  vector_env_nums: 1
  parallel: 1

algo_cfgs:
  steps_per_epoch: 8759
  update_iters: 40
  target_kl: 0.10
  kl_early_stop: true
  batch_size: 256
  obs_normalize: true
  reward_normalize: true
  cost_normalize: false
  entropy_coef: 0.005

lagrange_cfgs:
  cost_limit: 999999                   # disabled (GradS uses per-constraint only)
  lagrangian_multiplier_init: 1.0      # CHANGED: was 0.1 (non-zero from start)
  lambda_lr: 0.0001                    # CHANGED: was 0.05 (prevents explosion)
  lambda_optimizer: SGD
  lagrangian_upper_bound: 50.0         # NEW: safety cap on lambda growth

# GradS-specific config — tight per-constraint limits with 30-50% slack
# Achievable minimums from 43-epoch run (passive, no constraint pressure):
#   C1=23, C1d=127, C2=20353, C3=30616, C4=24517
grads_cfgs:
  sim_threshold: 0.8
  conflict_threshold: 0.5             # CHANGED: was 0.999 (enables conflict detection)
  cost_limit_0: 50                    # C1:  EV departure (217% of min 23)
  cost_limit_1: 300                   # C1d: EV dense (236% of min 127)
  cost_limit_2: 35000                 # C2:  Battery SoC (172% of min 20353)
  cost_limit_3: 35000                 # C3:  Building power (114% of min 30616, tightest)
  cost_limit_4: 35000                 # C4:  Grid power (143% of min 24517)

model_cfgs:
  actor:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.0005
  critic:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.001
  linear_lr_decay: false

logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  save_model_freq: 5
  log_dir: ./runs/grads_v2/grads_5bld
  window_lens: 1
