# R27c v2: R25b rewards + r_sg=1.5, r_sb=1.5 + FIXED Lagrangian
# Sauté=OFF, C1=unused, 4 constraints only
# Fixes: no anneal (r_ev=5 handles C0), upper_bound=35, C3=5000, Ki_0=0.05
algo: PPOLagMulti
env_id: CityLearnSafety-V2G-v2
seed: 42

train_cfgs:
  device: cuda:0
  total_steps: 350360
  vector_env_nums: 1
  parallel: 1

algo_cfgs:
  steps_per_epoch: 8759
  update_iters: 10
  target_kl: 0.06
  kl_early_stop: true
  batch_size: 256
  obs_normalize: true
  reward_normalize: true
  cost_normalize: false
  standardized_cost_adv: true
  entropy_coef: 0.005
  max_grad_norm: 0.5

lagrange_cfgs:
  cost_limit: 21800
  lagrangian_multiplier_init: 0.001
  lambda_lr: 0.02
  lambda_optimizer: Adam
  lagrangian_upper_bound: 35.0

multi_cfgs:
  tau: 1.0

  # Fixed limits — no annealing (r_ev=5.0 handles C0 from epoch 0)
  cost_limit_0: 200
  cost_limit_1: 999999
  cost_limit_2: 4000
  cost_limit_3: 5000
  cost_limit_4: 1500

  pid_kp: 0.1
  pid_ki: 0.01
  pid_kd: 0.01
  pid_d_delay: 10
  pid_delta_p_ema_alpha: 0.95
  pid_delta_d_ema_alpha: 0.95

  # C0 PID — aggressive (r_ev handles dense, Lambda is backup)
  pid_kp_0: 2.0
  pid_ki_0: 0.05
  pid_kd_0: 0.0
  pid_ema_p_0: 0.0

  pid_kp_3: 0.5
  pid_ki_3: 0.05

  pid_kp_4: 0.3
  pid_ki_4: 0.03

model_cfgs:
  actor_type: gaussian_learning
  actor:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.0003
  critic:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.001
  linear_lr_decay: false

logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  save_model_freq: 5
  log_dir: ./runs/baseline_grid_rewards/5bld
  window_lens: 1
