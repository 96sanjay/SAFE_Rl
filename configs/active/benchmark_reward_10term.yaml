# R28a: Clean 9-term reward, balanced Lagrangian
# =========================================================
# Based on R25b Softmax ablation analysis:
#   - 9 active reward terms (was 14), no redundancy
#   - EV rewards reduced → Lagrangian stays active for C0
#   - r_sg ENABLED (quadratic) → targets C4 evening peaks
#   - r_sb ENABLED → per-building C3 signal
#   - r_grid_mild OFF → r_sg covers it
#   - r_v2g_ctx 3.0→1.0 → reduced but kept (critical C0 signal)
#   - r_ev_slack_arb OFF → noise, not constraint-aligned
#   - C4 PID gains 3x → λ₄ was growing too slowly
#   - C0 limit tightened 200→100 (already solved at 33)
#   - 60 epochs (was 40) — C2/C3 still converging
# =========================================================
algo: PPOLagMulti
env_id: CityLearnSafety-V2G-v2
seed: 42

train_cfgs:
  device: cuda:0
  total_steps: 525540
  vector_env_nums: 1
  parallel: 1

algo_cfgs:
  steps_per_epoch: 8759
  update_iters: 10
  target_kl: 0.06
  kl_early_stop: true
  batch_size: 256
  obs_normalize: true
  reward_normalize: true
  cost_normalize: false
  standardized_cost_adv: true
  entropy_coef: 0.005
  max_grad_norm: 0.5

lagrange_cfgs:
  cost_limit: 21800
  lagrangian_multiplier_init: 0.001
  lambda_lr: 0.02
  lambda_optimizer: Adam
  lagrangian_upper_bound: 35.0

multi_cfgs:
  tau: 1.0

  # Per-constraint cost limits
  cost_limit_0: 100       # was 200 — tightened (C0 solved at 33)
  cost_limit_1: 999999    # OFF (Sauté disabled)
  cost_limit_2: 1000      # was 1500 — tightened
  cost_limit_3: 5000      # unchanged — still converging
  cost_limit_4: 8000      # unchanged — r_sg + PID fix it

  # PID defaults
  pid_kp: 0.1
  pid_ki: 0.01
  pid_kd: 0.01
  pid_d_delay: 10
  pid_delta_p_ema_alpha: 0.95
  pid_delta_d_ema_alpha: 0.95

  # C0: reduced PID (reward + Lagrangian co-drive)
  pid_kp_0: 1.0           # was 2.0
  pid_ki_0: 0.03          # was 0.05
  pid_kd_0: 0.0
  pid_ema_p_0: 0.0

  # C2: slightly more aggressive
  pid_kp_2: 0.2           # was 0.1 (default)
  pid_ki_2: 0.02          # was 0.01 (default)

  # C3: unchanged — still converging well
  pid_kp_3: 0.5
  pid_ki_3: 0.05
  pid_kd_3: 0.0

  # C4: 3x stronger — λ₄ was at 9% cap, growing too slowly
  pid_kp_4: 0.8           # was 0.3
  pid_ki_4: 0.08          # was 0.03

model_cfgs:
  actor_type: gaussian_learning
  actor:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.0003
  critic:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.001
  linear_lr_decay: false

logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  save_model_freq: 5
  log_dir: ./runs/benchmark_reward_10term/5bld
  window_lens: 1
