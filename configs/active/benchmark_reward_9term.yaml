# R28b: 9-term reward, feasible limits, balanced EV signal
# =========================================================
# Based on R28a analysis + R25b stable comparison:
#   - r_ev RESTORED at 2.0 (was 0.5) — dense charge urgency critical
#   - r_ev_slack_arb RESTORED at 1.0 — solar-aware arbitrage + peak V2G
#   - r_v2g_ctx 1.0→1.5 — partial restore from R25b (was 3.0)
#   - r_ev_smart kept at 1.5 — headroom-gated price signal
#   - r_eco REMOVED (harmful), r_load_shift REMOVED (dead),
#     r_peak_shave REMOVED (dead), r_ev_guard REMOVED (redundant)
#   - C3 limit 5000→18000, C4 limit 8000→13000 (feasible targets)
#   - C2 limit 1000→3500 (R25b achieved 3542)
#   - Lambda cap 35→25 (feasible limits need less pressure)
#   - C3/C4 PID reduced (limits near floor, gentle nudging)
#   - 100 epochs
# =========================================================
algo: PPOLagMulti
env_id: CityLearnSafety-V2G-v2
seed: 42

train_cfgs:
  device: cuda:0
  total_steps: 875900
  vector_env_nums: 1
  parallel: 1

algo_cfgs:
  steps_per_epoch: 8759
  update_iters: 10
  target_kl: 0.06
  kl_early_stop: true
  batch_size: 256
  obs_normalize: true
  reward_normalize: true
  cost_normalize: false
  standardized_cost_adv: true
  entropy_coef: 0.005
  max_grad_norm: 0.5

lagrange_cfgs:
  cost_limit: 21800
  lagrangian_multiplier_init: 0.001
  lambda_lr: 0.02
  lambda_optimizer: Adam
  lagrangian_upper_bound: 25.0

multi_cfgs:
  tau: 1.0

  # Per-constraint cost limits
  cost_limit_0: 100       # EV departure deficit
  cost_limit_1: 999999    # OFF (Sauté disabled)
  cost_limit_2: 3500      # Battery SoC (R25b achieved 3542)
  cost_limit_3: 18000     # Building power (feasible target)
  cost_limit_4: 13000     # Grid import (feasible target)

  # PID defaults
  pid_kp: 0.1
  pid_ki: 0.01
  pid_kd: 0.01
  pid_d_delay: 10
  pid_delta_p_ema_alpha: 0.95
  pid_delta_d_ema_alpha: 0.95

  # C0: reward + Lagrangian co-drive
  pid_kp_0: 2.0
  pid_ki_0: 0.05
  pid_kd_0: 0.0
  pid_ema_p_0: 0.0

  # C2: moderate (limit near achievable)
  pid_kp_2: 0.1
  pid_ki_2: 0.01

  # C3: gentle (limit 18k, feasible target)
  pid_kp_3: 0.1
  pid_ki_3: 0.01
  pid_kd_3: 0.0

  # C4: gentle (limit 13k, feasible target)
  pid_kp_4: 0.1
  pid_ki_4: 0.01

model_cfgs:
  actor_type: gaussian_learning
  actor:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.0003
  critic:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.001
  linear_lr_decay: false

logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  save_model_freq: 5
  log_dir: ./runs/benchmark_reward_9term/5bld
  window_lens: 1
