# R25b + GradS ablation: Same rewards as R25b, GradS instead of Softmax
# =========================================================
# Purpose: Compare gradient combination methods (GradS vs Softmax)
# on the stable R25b reward configuration.
# Lagrangian: Fixed (matching R27e), PID-based, upper_bound=35
# =========================================================
algo: PPOLagGradS
env_id: CityLearnSafety-V2G-v2
seed: 42

train_cfgs:
  device: cuda:0
  total_steps: 350360
  vector_env_nums: 1
  parallel: 1

algo_cfgs:
  steps_per_epoch: 8759
  update_iters: 10
  target_kl: 0.06
  kl_early_stop: true
  batch_size: 256
  obs_normalize: true
  reward_normalize: true
  cost_normalize: false
  standardized_cost_adv: true
  entropy_coef: 0.005
  max_grad_norm: 0.5

lagrange_cfgs:
  cost_limit: 21800
  lagrangian_multiplier_init: 0.001
  lambda_lr: 0.02
  lambda_optimizer: Adam
  lagrangian_upper_bound: 35.0

# GradS-specific config (replaces multi_cfgs)
grads_cfgs:
  sim_threshold: 0.8
  conflict_threshold: 0.999
  sampling: uniform
  normalize_cost_grad: false
  zscore_cost_adv: false

  # Per-constraint cost limits (same as R27e fixed Lagrangian)
  cost_limit_0: 200
  cost_limit_1: 999999
  cost_limit_2: 1500
  cost_limit_3: 5000
  cost_limit_4: 8000

  # PID params — D-term per constraint (one-sided: only fires on cost increase)
  pid_kp: 0.1
  pid_ki: 0.01
  pid_kd: 0.01
  pid_d_delay: 10
  pid_delta_p_ema_alpha: 0.95
  pid_delta_d_ema_alpha: 0.95

  # C0: aggressive PI, no D (sparse/noisy departures + high Kp already)
  pid_kp_0: 2.0
  pid_ki_0: 0.05
  pid_kd_0: 0.0
  pid_ema_p_0: 0.0

  # C3: PI only, no D (conflicts with C0 — D would escalate arms race)
  pid_kp_3: 0.5
  pid_ki_3: 0.05
  pid_kd_3: 0.0

  # C4: full PID (dense/smooth/aggregate, inherits pid_kd=0.01)
  pid_kp_4: 0.3
  pid_ki_4: 0.03

model_cfgs:
  actor_type: gaussian_learning
  actor:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.0003
  critic:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.001
  linear_lr_decay: false

logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  save_model_freq: 5
  log_dir: ./runs/r25b_grads_ablation/5bld
  window_lens: 1
