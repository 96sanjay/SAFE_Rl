# R11b: PPOLagMulti (per-constraint lambdas) + Step 1 improvements
# A/B comparison Run B — multi-lambda with:
#   - r_ev removed (C1 handles EV in CMDP cost)
#   - SoC safety clamp (hard guarantee)
#   - SoC barrier reward (alpha=0.5)
#   - C2 zeroed (redundant with clamp+barrier)
#   - Cost advantage clipping (±2×std(adv_r))
#   - Lambda cap at 3.0 per constraint
# Architecture: MLP (isolate lambda mechanism comparison)
algo: PPOLagMulti
env_id: CityLearnSafety-V2G-v2
seed: 42

train_cfgs:
  total_steps: 437950          # 50 epochs × 8759 steps/epoch
  vector_env_nums: 1
  parallel: 1

algo_cfgs:
  steps_per_epoch: 8759
  update_iters: 30             # matched to Run A (was 60 in v5)
  target_kl: 0.12              # matched to Run A (was 0.10 in v5)
  kl_early_stop: true
  batch_size: 128              # matched to Run A (was 256 in v5)
  obs_normalize: true
  reward_normalize: true
  cost_normalize: false
  standardized_cost_adv: true  # Z-score per-constraint advantages
  entropy_coef: 0.005
  max_grad_norm: 40.0

lagrange_cfgs:
  cost_limit: 21800                      # Sum of per-constraint limits (logging only)
  lagrangian_multiplier_init: 0.1
  lambda_lr: 0.035                       # Adam: effective step ~0.035/epoch
  lambda_optimizer: Adam
  lagrangian_upper_bound: 3.0            # Cap each lambda at 3.0

multi_cfgs:
  tau: 1.0

  # Per-constraint limits (C2 irrelevant since weight=0, kept for logging)
  cost_limit_0: 1800           # C0: EV departure
  cost_limit_1: 1500           # C1: EV dense
  cost_limit_2: 4000           # C2: Battery SoC (inactive, weight=0)
  cost_limit_3: 12000          # C3: Building power
  cost_limit_4: 2500           # C4: Grid power

model_cfgs:
  actor:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.0003                 # matched to Run A (was 0.0002 in v5)
  critic:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.001
  linear_lr_decay: false

logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  save_model_freq: 5
  log_dir: ./runs/r11b_multi_improved/5bld
  window_lens: 1
