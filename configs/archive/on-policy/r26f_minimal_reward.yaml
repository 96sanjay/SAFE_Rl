# R26f: Minimal Reward CMDP + STEMS V3 (GCN-Transformer)
# HYPOTHESIS: Remove 11 reward components that duplicate constraints.
# Keep only r_eco + r_ren + r_ramp + r_ev + r_ev_guard (5 total, down from 16).
# Let Lagrangian handle C2/C3/C4 without reward interference.
# STEMS fix: lr 3e-4->1e-4, target_kl 0.06->0.12, batch 256->512
# 120 epochs (extended for 162K param STEMS encoder)
algo: PPOLagMulti
env_id: CityLearnSafety-V2G-v2
seed: 42

train_cfgs:
  device: cuda:0
  total_steps: 1051080       # 120 epochs * 8759 steps
  vector_env_nums: 1
  parallel: 1

algo_cfgs:
  steps_per_epoch: 8759
  update_iters: 10
  target_kl: 0.12            # CHANGED: 0.06 -> 0.12 (fix StopIter=1)
  kl_early_stop: true
  batch_size: 512             # CHANGED: 256 -> 512 (smoother gradients)
  obs_normalize: true
  reward_normalize: true
  cost_normalize: false
  standardized_cost_adv: true
  entropy_coef: 0.005
  max_grad_norm: 0.5

lagrange_cfgs:
  cost_limit: 21800
  lagrangian_multiplier_init: 0.001
  lambda_lr: 0.02
  lambda_optimizer: Adam
  lagrangian_upper_bound: 10.0

multi_cfgs:
  tau: 1.0
  cost_limit_0: 999999
  cost_limit_1: 999999       # C1 disabled
  cost_limit_2: 1500
  cost_limit_3: 15000
  cost_limit_4: 10000

  anneal_cost_limit_0: [999999, 50, 20, 40]

  pid_kp: 0.1
  pid_ki: 0.01
  pid_kd: 0.01
  pid_d_delay: 10
  pid_delta_p_ema_alpha: 0.95
  pid_delta_d_ema_alpha: 0.95

  pid_kp_0: 5.0
  pid_ki_0: 0.0
  pid_kd_0: 0.0
  pid_ema_p_0: 0.0
  pid_kp_3: 0.3
  pid_ki_3: 0.03
  pid_kp_4: 0.2
  pid_ki_4: 0.02

model_cfgs:
  actor_type: gaussian_learning
  actor:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.0001                # CHANGED: 0.0003 -> 0.0001 (fix StopIter=1)
  critic:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.001
  linear_lr_decay: false

logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  save_model_freq: 5
  log_dir: ./runs/r26f_minimal_reward/5bld
  window_lens: 1
