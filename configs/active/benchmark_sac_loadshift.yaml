# R28c_sac: SAC-Lag version of R28c (10-term reward, feasible limits)
# =========================================================
# Same reward terms, cost limits, PID gains as R28c PPO
# SAC-specific: replay buffer 1M, auto-entropy, twin Q-critics
# Runs on CPU to keep GPU for R28b/R28c PPO
# =========================================================
algo: SACLagMulti
env_id: CityLearnSafety-V2G-v2
seed: 42

train_cfgs:
  device: cpu
  total_steps: 875900        # 100 epochs × 8759
  vector_env_nums: 1
  parallel: 1

algo_cfgs:
  steps_per_epoch: 8759       # full year episode
  update_cycle: 1             # update every step
  update_iters: 1             # 1 gradient step per update
  size: 1000000               # replay buffer (~114 episodes)
  batch_size: 256
  reward_normalize: false
  cost_normalize: false
  obs_normalize: true
  max_grad_norm: 40.0
  polyak: 0.005               # soft target update
  gamma: 0.99
  start_learning_steps: 8759  # 1 full episode random exploration
  policy_delay: 2
  use_exploration_noise: false
  alpha: 0.2
  auto_alpha: true
  use_cost: true
  warmup_epochs: 5

model_cfgs:
  weight_initialization_mode: kaiming_uniform
  actor_type: gaussian_sac
  linear_lr_decay: false
  actor:
    hidden_sizes: [256, 256]
    activation: relu
    lr: 0.0003
  critic:
    num_critics: 2
    hidden_sizes: [256, 256]
    activation: relu
    lr: 0.0003

lagrange_cfgs:
  cost_limit: 21800
  lagrangian_multiplier_init: 0.001
  lambda_lr: 0.02
  lambda_optimizer: Adam
  lagrangian_upper_bound: 25.0

multi_cfgs:
  tau: 1.0

  # Per-constraint cost limits (same as R28c PPO)
  cost_limit_0: 100       # EV departure deficit
  cost_limit_1: 999999    # OFF (Sauté disabled)
  cost_limit_2: 3500      # Battery SoC
  cost_limit_3: 18000     # Building power
  cost_limit_4: 13000     # Grid import

  # PID gains (same as R28c PPO)
  pid_kp: 0.1
  pid_ki: 0.01
  pid_kd: 0.01
  pid_d_delay: 10
  pid_delta_p_ema_alpha: 0.95
  pid_delta_d_ema_alpha: 0.95

  pid_kp_0: 2.0
  pid_ki_0: 0.05
  pid_kd_0: 0.0
  pid_ema_p_0: 0.0

  pid_kp_2: 0.1
  pid_ki_2: 0.01

  pid_kp_3: 0.1
  pid_ki_3: 0.01
  pid_kd_3: 0.0

  pid_kp_4: 0.1
  pid_ki_4: 0.01

logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  save_model_freq: 5
  log_dir: ./runs/benchmark_sac_loadshift/5bld
  window_lens: 1
