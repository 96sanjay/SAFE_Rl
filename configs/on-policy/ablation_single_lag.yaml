# Ablation: Single-Lambda PPOLag (OmniSafe built-in)
# IDENTICAL to R21 except: single lambda on aggregate cost, no PID, no multi_cfgs.
# Tests: does per-constraint multi-lambda + PID improve over single-lambda?
#
# Differences from R21:
#   - algo: PPOLag (not PPOLagMulti)
#   - Single lambda on aggregate cost (cost_limit: 21800, same as R21's total)
#   - No PID controller
#   - No per-constraint cost limits
#   - No softmax advantage weighting
#   - No C0 curriculum (single lambda can't anneal per-constraint)
# Everything else (reward, architecture, env, seed) identical.

algo: PPOLag
env_id: CityLearnSafety-V2G-v2
seed: 42

train_cfgs:
  total_steps: 787110
  vector_env_nums: 1
  parallel: 1

algo_cfgs:
  steps_per_epoch: 8759
  update_iters: 30
  target_kl: 0.08
  kl_early_stop: true
  batch_size: 256
  obs_normalize: true
  reward_normalize: true
  cost_normalize: false
  entropy_coef: 0.005
  max_grad_norm: 40.0

lagrange_cfgs:
  cost_limit: 21800
  lagrangian_multiplier_init: 0.001
  lambda_lr: 0.035
  lambda_optimizer: Adam

model_cfgs:
  actor_type: gaussian_learning
  actor:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.0001
  critic:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.001
  linear_lr_decay: false

logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  save_model_freq: 5
  log_dir: ./runs/ablation_single_lag/5bld
  window_lens: 1
