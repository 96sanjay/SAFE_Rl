# Temperature case study: masked single-lagrangian comfort constraint
# Tuned PPO update settings to avoid immediate KL early-stop.

algo: PPOLagTempMasked
env_id: CityLearnTemp-Comfort-Masked-v0
seed: 42

train_cfgs:
  total_steps: 220700
  vector_env_nums: 1
  parallel: 1

algo_cfgs:
  steps_per_epoch: 2207
  update_iters: 10
  target_kl: 0.15
  kl_early_stop: true
  batch_size: 512
  obs_normalize: true
  reward_normalize: true
  cost_normalize: false
  entropy_coef: 0.01
  max_grad_norm: 40.0

lagrange_cfgs:
  cost_limit: 55.0
  lagrangian_multiplier_init: 0.001
  lambda_lr: 0.035
  lambda_optimizer: Adam

model_cfgs:
  actor_type: gaussian_learning
  actor:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.0001
  critic:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.0003
  linear_lr_decay: false

logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  save_model_freq: 5
  log_dir: ./runs/ppolag_temp_masked_single_constraint_tuned
  window_lens: 1
