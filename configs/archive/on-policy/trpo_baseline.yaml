# TRPO Baseline: Unconstrained RL for comparison
# Deep architecture for 153-dim observation space
algo: TRPO
env_id: CityLearnSafety-SoC-v0
seed: 42

train_cfgs:
  total_steps: 875900          # 100 epochs × 8759 steps
  vector_env_nums: 1
  parallel: 1

algo_cfgs:
  steps_per_epoch: 8759
  update_iters: 80
  batch_size: 1024             # Large batches for stable trust-region
  target_kl: 0.02              # Trust region constraint
  cg_iters: 10                 # Conjugate gradient iterations
  cg_damping: 0.1
  
  # Normalization
  obs_normalize: true
  reward_normalize: false      # Keep rewards interpretable
  cost_normalize: false
  
  # Regularization
  use_critic_norm: true
  entropy_coef: 0.01           # Encourage exploration

model_cfgs:
  # Deep network for complex 153-dim obs
  actor:
    hidden_sizes: [512, 512, 256]
    activation: tanh           # Standard for TRPO
    lr: 0.0003                 # Adam for actor
  
  critic:
    hidden_sizes: [512, 512, 256]
    activation: tanh
    lr: 0.001                  # Adam for critic (faster convergence)

logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  save_model_freq: 10
  log_dir: ./runs/trpo_baseline_v2
  window_lens: 1
