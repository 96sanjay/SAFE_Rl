algo: CSACLBV2G
env_id: CityLearnSafety-V2G-v2
seed: 42

train_cfgs:
  device: cuda:0
  torch_threads: 8
  vector_env_nums: 1
  parallel: 1
  # 100 epochs × 8759 steps/epoch = 875900 steps  (match all other R28 runs)
  total_steps: 875900
  eval_episodes: 1

algo_cfgs:
  steps_per_epoch: 8759
  update_cycle: 1
  update_iters: 1
  size: 2000000         # ~230 epochs of replay
  batch_size: 256
  reward_normalize: false
  cost_normalize: false
  obs_normalize: true   # device coercion via ObsNormalize (matches R28 SACLag)
  max_grad_norm: 40.0
  use_critic_norm: false
  critic_norm_coeff: 0.001
  polyak: 0.005
  gamma: 0.99
  start_learning_steps: 10000
  policy_delay: 2
  use_exploration_noise: false
  alpha: 0.2
  auto_alpha: true      # let entropy regularisation self-tune
  use_cost: true
  cost_limit: 1.0       # tune: aggregate per-step average
  barrier_factor: 10.0  # softer than temp case; tighten after first run

logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  save_model_freq: 10
  log_dir: ./runs/csac_lb_v2g
  window_lens: 10

model_cfgs:
  weight_initialization_mode: kaiming_uniform
  actor_type: gaussian_sac
  linear_lr_decay: false
  actor:
    hidden_sizes: [256, 256]
    activation: relu
    lr: 0.0003
  critic:
    num_critics: 2
    hidden_sizes: [256, 256]
    activation: relu
    lr: 0.0003

env_cfgs: {}
eval_env_cfgs: {}

# R28 parity env vars (IDENTICAL to run_r28_benchmarks.sh) — makes this run
# directly comparable to every other R28 algorithm on EpRet/EpCost.
env_overrides:
  # CityLearn core
  CITYLEARN_CENTRAL_AGENT: "1"
  CITYLEARN_REWARD_TYPE: "stems"
  CITYLEARN_EXPORT_FACTOR: "0.7"
  CITYLEARN_TEMPORAL_WINDOW: "0"
  CITYLEARN_STEMS_P_BUILDING_MAX: "4.6083"
  CITYLEARN_STEMS_P_GRID_MAX: "10.2352"
  CITYLEARN_STEMS_SOC_LOW: "0.0"
  CITYLEARN_STEMS_SOC_HIGH: "0.95"
  CITYLEARN_STEMS_PNORM_P: "4.0"
  CITYLEARN_PID_LAGRANGE: "0"
  CITYLEARN_EV_SAUTE: "0"
  CITYLEARN_C3_CONTROLLABLE: "1"
  CITYLEARN_BATT_CLAMP: "0"
  CITYLEARN_SPATIAL_OBS: "0"
  CITYLEARN_WM_DISABLE: "1"
  CITYLEARN_EV_ACTION_CLAMP: "0"
  CITYLEARN_ACTION_MASK: "0"
  CITYLEARN_POLICY_ACTION_MASK: "0"
  # 9 active reward terms (same as R28)
  STEMS_LAMBDA_EV: "2.0"
  STEMS_ALPHA_EV_SMART: "1.5"
  STEMS_EV_SLACK_ARB_SCALE: "1.0"
  STEMS_ALPHA_V2G_CONTEXT: "1.5"
  STEMS_ALPHA_BARRIER: "0.5"
  STEMS_ALPHA_GRID: "0.5"
  STEMS_SG_THRESHOLD: "0.5"
  STEMS_SG_EXPORT_CREDIT: "0.5"
  STEMS_ALPHA_BUILD: "0.3"
  STEMS_SB_ASYMMETRIC: "1"
  STEMS_BETA_RAMP: "0.3"
  STEMS_XI_RENEWABLE: "0.2"
  # Disabled reward terms (explicitly zero, same as R28)
  STEMS_ALPHA_EV_GUARD: "0.0"
  STEMS_ALPHA_GRID_MILD: "0.0"
  STEMS_MU_ECONOMIC: "0.0"
  STEMS_ALPHA_PEAK_SHAVE: "0.0"
  STEMS_ALPHA_LOAD_SHIFT: "0.0"
  # Cost aggregation weights (same as R28)
  COST_W_C1_DENSE: "0.0"
  COST_W_C2: "5.0"
  COST_W_C3: "5.0"
  CITYLEARN_W_COST_EV: "1.0"
  CITYLEARN_W_COST_SOC: "10.0"
  CITYLEARN_W_COST_BUILDING: "0.5"
  CITYLEARN_W_COST_GRID: "0.05"
  CITYLEARN_EV_COST_SCALE: "3.0"
  CITYLEARN_EV_MISSING_ACTION_MODE: "assume_full"
  CITYLEARN_INCLUDE_EV_COST: "1"
