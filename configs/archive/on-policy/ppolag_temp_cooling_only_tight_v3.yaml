# Temperature case study: PPO-Lag + PID + BC (TIGHTENED v3)
# Changes from v2 (cost was 32.9 vs limit 40 — room to push):
# - force_trigger: 25 -> 24 (force cooling 2°C below comfort bound)
# - force_range: 2 -> 1.5 (even faster forced cooling ramp)
# - setpoint_deadband: 0.3 -> 0.1 (tighter deadband)
# - full_range: 4.0 -> 3.0 (allow more cooling earlier)
# - cost_limit: 40 -> 25 (was 32.9 actual, tighten hard)
# - penalty_max: 10 -> 15 (allow even stronger penalty if needed)

algo: PPOLagTempCoolingOnly
env_id: CityLearnTemp-CoolingOnly-Masked-Reward-v0
seed: 42

train_cfgs:
  total_steps: 132420        # 60 epochs * 2207 steps
  vector_env_nums: 1
  parallel: 1

algo_cfgs:
  steps_per_epoch: 2207
  update_iters: 10
  target_kl: 0.15
  kl_early_stop: true
  batch_size: 512
  obs_normalize: true
  reward_normalize: true
  cost_normalize: false
  entropy_coef: 0.01
  max_grad_norm: 40.0
  use_cost: true
  gamma: 0.99
  cost_gamma: 0.99
  lam: 0.95
  lam_c: 0.95
  clip: 0.2
  standardized_rew_adv: true
  standardized_cost_adv: true

lagrange_cfgs:
  cost_limit: 25.0
  lagrangian_multiplier_init: 0.001
  lambda_lr: 0.035
  lambda_optimizer: Adam

pid_lagrange_cfgs:
  cost_limit: 25.0               # was 40, tightened hard (actual was 32.9)
  pid_kp: 1.0
  pid_ki: 0.1
  pid_kd: 0.01
  pid_d_delay: 10
  pid_delta_p_ema_alpha: 0.95
  pid_delta_d_ema_alpha: 0.95
  penalty_max: 15.0              # was 10, allow stronger penalty
  lagrangian_multiplier_init: 0.001
  normalize_by_limit: true

bc_cfgs:
  epochs: 10
  rollout_steps: 2207
  batch_size: 512
  seed: 42

model_cfgs:
  actor_type: gaussian_learning
  actor:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.0001
  critic:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.0003
  linear_lr_decay: false

env_cfgs:
  policy_mask_cooling_force_trigger: 24.0    # was 25, force cooling 2°C below bound
  policy_mask_cooling_force_range: 1.5       # was 2.0, faster ramp
  policy_mask_cooling_min_cap: 0.8
  policy_mask_cooling_full_range: 3.0        # was 4.0, more cooling range
  policy_mask_cooling_setpoint_deadband: 0.1 # was 0.3, tighter deadband

logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  save_model_freq: 1
  log_dir: ./runs/ppolag_temp_cooling_only_tight_v3
  window_lens: 1
