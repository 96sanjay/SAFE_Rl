# configs/ppo_lag_soc.yaml
algo: PPOLag
env_id: CityLearnSafety-SoC-v0

train_cfgs:
  total_steps: 87590        # e.g., 10 full episodes (10 × 8759)
  #max_ep_len: 8759          # ← critical: match measured episode length
  vector_env_nums: 1        # or, if your build rejects this key:
  parallel: 1               # fine to keep

  #steps_per_epoch: 8759
# env_cfgs:
#   num_envs: 1

algo_cfgs:
  steps_per_epoch: 8759     # ← one full episode per epoch
  target_kl: 0.03           # relax slightly to reduce early KL stops
  obs_normalize: true
  reward_normalize: true

logger_cfgs:
  use_wandb: false
  use_tensorboard: true

lagrange_cfgs:
  cost_limit: 0.05
  lagrangian_multiplier_init: 0.5
