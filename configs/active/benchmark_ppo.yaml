# R28 vanilla PPO benchmark: stock OmniSafe PPO with NO constraint handling.
# Optimizes reward only; cost is logged but never affects updates (no Lagrangian,
# no projection, no barrier, no state augmentation). The "do-nothing-about-safety"
# baseline against which all constrained algorithms are compared.
algo: PPO
env_id: CityLearnSafety-V2G-v2
seed: 42

train_cfgs:
  device: cuda:0
  total_steps: 875900    # 100 epochs x 8759 (matches other R28 baselines)
  vector_env_nums: 1
  parallel: 1

algo_cfgs:
  steps_per_epoch: 8759
  update_iters: 40
  batch_size: 256
  target_kl: 0.02
  kl_early_stop: true
  entropy_coef: 0.005
  obs_normalize: true
  reward_normalize: true
  cost_normalize: false
  standardized_rew_adv: true
  standardized_cost_adv: false
  max_grad_norm: 0.5
  use_cost: false        # vanilla PPO: cost is logged via env, not used in updates

model_cfgs:
  actor_type: gaussian_learning
  actor:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.0003
  critic:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.001
  linear_lr_decay: false

logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  save_model_freq: 10
  log_dir: ./runs/benchmark_ppo/5bld
  window_lens: 1
