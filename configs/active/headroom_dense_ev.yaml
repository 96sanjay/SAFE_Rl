# R27b: r_ev=2.5 dense penalty + sparse C0 Lagrangian
# =========================================================
# Like R25b approach but r_ev=2.5 (not 5.0) so Lambda_0 stays active.
# r_ev provides dense per-step charging gradient.
# C0 Lagrangian provides constraint enforcement pressure.
# r_ev_smart=1.5 provides departure-aware price timing.
#
# Reward terms:
#   r_sg=1.5, r_sb=1.5, r_ramp=0.3, r_ren=0.3, r_barrier=0.3
#   r_ev=2.5 (dense charging penalty), r_ev_smart=1.5 (price timing)
# =========================================================
algo: PPOLagMulti
env_id: CityLearnSafety-V2G-v2
seed: 42

train_cfgs:
  device: cuda:0
  total_steps: 350360
  vector_env_nums: 1
  parallel: 1

algo_cfgs:
  steps_per_epoch: 8759
  update_iters: 10
  target_kl: 0.08
  kl_early_stop: true
  batch_size: 512
  obs_normalize: true
  reward_normalize: true
  cost_normalize: false
  standardized_cost_adv: true
  entropy_coef: 0.005
  max_grad_norm: 0.5

lagrange_cfgs:
  cost_limit: 21800
  lagrangian_multiplier_init: 0.001
  lambda_lr: 0.02
  lambda_optimizer: Adam
  lagrangian_upper_bound: 35.0

multi_cfgs:
  tau: 1.0

  cost_limit_0: 200
  cost_limit_1: 999999
  cost_limit_2: 1500
  cost_limit_3: 5000
  cost_limit_4: 8000

  pid_kp: 0.1
  pid_ki: 0.01
  pid_kd: 0.01
  pid_d_delay: 10
  pid_delta_p_ema_alpha: 0.95
  pid_delta_d_ema_alpha: 0.95

  # C0: aggressive PID
  pid_kp_0: 2.0
  pid_ki_0: 0.05
  pid_kd_0: 0.0
  pid_ema_p_0: 0.0

  pid_kp_3: 0.5
  pid_ki_3: 0.05

  pid_kp_4: 0.3
  pid_ki_4: 0.03

model_cfgs:
  actor_type: gaussian_learning
  actor:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.0002
  critic:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.001
  linear_lr_decay: false

logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  save_model_freq: 5
  log_dir: ./runs/headroom_dense_ev/5bld
  window_lens: 1
