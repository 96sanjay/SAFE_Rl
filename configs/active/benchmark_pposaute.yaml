# R28 PPOSaute benchmark: PPO + state augmentation (Saute RL)
# Family: state augmentation (vs Lagrangian/projection/barrier in other R28 algos).
# See docs/superpowers/specs/2026-04-17-pposaute-r28-benchmark-design.md
algo: PPOSaute
env_id: CityLearnSafety-V2G-v2
seed: 42

train_cfgs:
  device: cuda:0
  total_steps: 875900    # 100 epochs x 8759 steps
  vector_env_nums: 1
  parallel: 1

algo_cfgs:
  steps_per_epoch: 8759
  update_iters: 40
  batch_size: 256
  target_kl: 0.02
  kl_early_stop: true
  entropy_coef: 0.005
  obs_normalize: true
  reward_normalize: false   # Saute adapter forbids (see spec Fairness note)
  cost_normalize: false     # Saute adapter forbids
  standardized_rew_adv: true
  standardized_cost_adv: true
  use_max_grad_norm: true
  max_grad_norm: 0.5
  use_cost: false           # Saute has no cost critic (safety is in state)

  # Saute-specific knobs (no lagrange_cfgs block - no Lagrangian)
  safety_budget: 400000.0
  saute_gamma: 0.9999
  unsafe_reward: -1.0
  max_ep_len: 8759

model_cfgs:
  actor_type: gaussian_learning
  actor:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.0003
  critic:
    hidden_sizes: [256, 256]
    activation: tanh
    lr: 0.001
  linear_lr_decay: false

logger_cfgs:
  use_wandb: false
  use_tensorboard: true
  save_model_freq: 10
  log_dir: ./runs/benchmark_pposaute/5bld
  window_lens: 1
